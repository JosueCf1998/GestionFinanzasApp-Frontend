<ion-content [fullscreen]="true" class="auth-content">

    <!-- Background View -->
  <div class="background-container"></div>

    <!-- Container View -->
  <div class="container">
    <!-- Logo/Header -->
    <div class="header">
    </div>

    <!-- Content -->
    <div class="main-content">
      <!-- Section Content-->
      <section class="content-area">
        <ion-img src="assets/image/logo.png" class="logo"></ion-img>
        <h1>¡Le damos la bienvenida a la App de Gestión de Finanzas!</h1>
        <p>Una Aplicacion que nos ayuda a controlar nuestros ingresos y gastos de una manera mas sencilla</p>
      </section>

      <!-- Section Buttons -->
      <div class="section-buttons">
        <ion-button
          expand="block"
          shape="round"
          class="custom-btn"
          (click)="toNavigate()">
          Comenzamos!
        </ion-button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
    </footer>

  </div>
</ion-content>
