<!-- ==========================================================
     BUTTON
     ========================================================== -->

<ion-button
  class="fv-button"
  [expand]="expand"
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()">

  <ion-spinner
    *ngIf="loading"
    name="crescent">
  </ion-spinner>

  <span *ngIf="!loading">

    {{ text }}

  </span>

</ion-button>
