<article
  class="summary-card"
  [class.summary-card--budget]="mode === 'budget'"
  [class.summary-card--classic]="appearance === 'classic'"
  [style.--card-color]="color">
  <div class="summary-card__hero">
    <div class="summary-card__top">
      <div class="summary-card__identity">
        <app-item-icon
          [icon]="icon"
          [color]="mode === 'budget' ? color : 'var(--fv-primary-light)'"
          size="md"
          variant="glass">
        </app-item-icon>

        <div class="summary-card__content">
          <span *ngIf="mode === 'period'" class="summary-card__eyebrow">{{ title }}</span>
          <h2>{{ mode === 'period' ? headline : title }}</h2>

          <p *ngIf="dateRange">
            <ion-icon src="assets/icon/calendar.svg" aria-hidden="true"></ion-icon>
            {{ dateRange }}
          </p>

          <span
            *ngIf="mode === 'budget' && statusLabel"
            class="summary-card__status"
            [attr.data-status]="status">
            <i></i>{{ statusLabel }}
          </span>
        </div>
      </div>

      <app-circular-progress
        [progress]="progress"
        label="Utilizado"
        ariaLabel="Porcentaje utilizado"
        [size]="mode === 'budget' ? 'sm' : 'md'">
      </app-circular-progress>
    </div>
  </div>

  <div class="summary-card__metrics" [class.summary-card__metrics--three]="showBalance">
    <div>
      <app-item-icon
        icon="budget-wallet"
        color="#6747df"
        size="xs"
        variant="soft"
        aria-hidden="true">
      </app-item-icon>
      <span class="summary-card__metric-label">Presupuestado</span>
      <strong>{{ currencySymbol }} {{ budgeted | number:'1.2-2' }}</strong>
    </div>
    <div>
      <app-item-icon
        icon="bills"
        color="#3657df"
        size="xs"
        variant="soft"
        aria-hidden="true">
      </app-item-icon>
      <span class="summary-card__metric-label">Utilizado</span>
      <strong>{{ currencySymbol }} {{ used | number:'1.2-2' }}</strong>
    </div>
    <div *ngIf="showBalance">
      <app-item-icon
        icon="money-bag"
        color="#12813d"
        size="xs"
        variant="soft"
        aria-hidden="true">
      </app-item-icon>
      <span class="summary-card__metric-label">{{ balanceLabel }}</span>
      <strong
        [class.summary-card__balance]="status !== 'EXCEEDED'"
        [class.summary-card__balance--danger]="status === 'EXCEEDED'">
        {{ currencySymbol }} {{ balance | number:'1.2-2' }}
      </strong>
    </div>
  </div>
</article>
