<div class="icon-picker" aria-label="Seleccionar icono">
  <div class="icon-picker__row">
    <button
      *ngFor="let option of quickOptions"
      type="button"
      class="icon-picker__button"
      [class.selected]="option.archivo === selected"
      [attr.aria-label]="option.nombre"
      [attr.aria-pressed]="option.archivo === selected"
      (click)="select(option)">
      <app-item-icon
        [icon]="option.archivo"
        [color]="iconColor(option)"
        size="md"
        variant="soft">
      </app-item-icon>
    </button>

    <button
      *ngIf="options.length > visibleCount"
      type="button"
      class="icon-picker__more"
      aria-label="Ver más iconos"
      [attr.aria-expanded]="isModalOpen"
      [class.active]="isModalOpen"
      (click)="openModal()">
      <span>…</span>
    </button>
  </div>
</div>

<app-base-modal
  [isOpen]="isModalOpen"
  title="Selecciona un icono"
  description="Elige el icono que identificará este elemento."
  (closed)="closeModal()">
      <div class="picker-grid">
        <button
          *ngFor="let option of options"
          type="button"
          class="picker-option"
          [class.selected]="option.archivo === selected"
          [attr.aria-label]="option.nombre"
          [attr.aria-pressed]="option.archivo === selected"
          (click)="select(option, true)">
          <app-item-icon
            [icon]="option.archivo"
            [color]="iconColor(option)"
            size="md"
            variant="soft">
          </app-item-icon>
        </button>
      </div>
</app-base-modal>
