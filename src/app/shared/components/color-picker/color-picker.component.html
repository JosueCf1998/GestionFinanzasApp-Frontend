<div class="color-picker" aria-label="Seleccionar color">
  <div class="color-picker__row">
    <button *ngFor="let option of quickOptions" type="button" class="color-picker__button" [style.background]="option.value" [class.selected]="option.value === selected" [attr.aria-label]="option.label" [attr.aria-pressed]="option.value === selected" (click)="select(option)"></button>
    <button *ngIf="options.length > visibleCount" type="button" class="color-picker__more" aria-label="Ver más colores" [attr.aria-expanded]="isModalOpen" [class.active]="isModalOpen" (click)="openModal()"><span>…</span></button>
  </div>
</div>

<app-base-modal
  [isOpen]="isModalOpen"
  title="Selecciona un color"
  description="Elige el color que identificará este elemento."
  (closed)="closeModal()">
      <div class="picker-grid">
        <button *ngFor="let option of options" type="button" class="picker-option" [class.selected]="option.value === selected" [attr.aria-label]="option.label" [attr.aria-pressed]="option.value === selected" (click)="select(option, true)">
          <span class="picker-swatch" [style.background]="option.value"></span>
        </button>
      </div>
</app-base-modal>
