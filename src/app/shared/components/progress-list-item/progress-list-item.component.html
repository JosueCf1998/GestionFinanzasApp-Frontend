<article
  class="progress-item"
  [class.progress-item--readonly]="!interactive"
  [attr.tabindex]="interactive ? 0 : null"
  [attr.role]="interactive ? 'button' : 'listitem'"
  [style.--item-color]="item.color"
  [attr.aria-label]="interactive ? 'Abrir ' + item.name : item.name"
  (click)="select()"
  (keydown.enter)="select()">

  <app-item-icon
    [icon]="item.icon"
    [color]="item.color"
    size="lg"
    shape="rounded"
    variant="soft">
  </app-item-icon>

  <div class="progress-item__content">
    <div class="progress-item__top">
      <strong>{{ item.name }}</strong>
      <b>{{ item.percentage }}%</b>
    </div>

    <div class="progress-item__meta">
      <span class="progress-item__status" [attr.data-status]="item.status">
        <i></i>
        {{ statusLabel }}
      </span>

      <span>
        {{ currencySymbol }} {{ item.used | number:'1.0-2' }}
        de
        {{ currencySymbol }} {{ item.budgeted | number:'1.0-2' }}
      </span>
    </div>

    <div class="progress-item__progress">
      <span
        [class.warning]="item.status === 'WARNING'"
        [class.exceeded]="item.status === 'EXCEEDED'"
        [style.width.%]="item.percentage > 100 ? 100 : item.percentage">
      </span>
    </div>
  </div>

  <ion-icon
    *ngIf="interactive"
    class="progress-item__arrow"
    src="assets/icon/right-inline.svg">
  </ion-icon>
</article>
