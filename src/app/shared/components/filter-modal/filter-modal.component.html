<app-base-modal
  [isOpen]="isOpen"
  [title]="title"
  [description]="description"
  [primaryText]="applyText"
  [primaryDisabled]="!isDateRangeValid"
  (closed)="close()"
  (primary)="apply()">
  <app-period-picker
    [period]="selectedPeriod"
    [periodValue]="selectedPeriodValue"
    [startDate]="selectedStartDate"
    [endDate]="selectedEndDate"
    (valueChange)="updatePeriod($event)">
  </app-period-picker>
</app-base-modal>
