<aside class="warning-message" role="alert">
  <header class="warning-message__header">
    <ion-icon class="warning-message__icon" [src]="icon" aria-hidden="true"></ion-icon>
    @if (title) {
      <strong class="warning-message__title">{{ title }}</strong>
    }
  </header>
  <p class="warning-message__description">{{ message }}</p>
</aside>
