<app-base-modal
  [isOpen]="modalOpen"
  title="Presupuesto creado"
  primaryText="Ir a mis presupuestos"
  [showHeader]="false"
  [showClose]="false"
  [backdropDismiss]="false"
  size="sm"
  (closed)="handleClosed()"
  (primary)="requestViewBudgets()">
  <section class="success-content" aria-label="Presupuesto creado correctamente">
    <div class="success-icon" aria-hidden="true">
      <ion-icon src="assets/icon/success-check.svg"></ion-icon>
    </div>

    <p class="success-eyebrow">¡Presupuesto creado!</p>
    <h2>{{ budgetName }}</h2>

    <dl class="receipt-details">
      <div>
        <dt>Presupuesto total</dt>
        <dd class="receipt-total">S/ {{ budgetTotal | number:'1.2-2' }}</dd>
      </div>
      <div>
        <dt>Programación</dt>
        <dd>{{ dateRange }}</dd>
      </div>
      <div>
        <dt>Cuentas</dt>
        <dd class="receipt-value--names">{{ accountsLabel }}</dd>
      </div>
      <div>
        <dt>Categorías</dt>
        <dd class="receipt-value--names">{{ categoriesLabel }}</dd>
      </div>
      <div *ngIf="note">
        <dt>Nota</dt>
        <dd class="receipt-value--note">{{ note }}</dd>
      </div>
    </dl>
  </section>
</app-base-modal>
