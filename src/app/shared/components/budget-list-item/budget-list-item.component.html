<article
  class="budget-item"
  tabindex="0"
  role="button"
  [style.--item-color]="budget.color"
  [attr.aria-label]="'Abrir ' + budget.name"
  (click)="select()"
  (keydown.enter)="select()">

  <app-item-icon
    class="budget-item__icon"
    [icon]="budget.icon"
    [color]="budget.color"
    size="lg"
    shape="rounded"
    variant="soft">
  </app-item-icon>

  <div class="budget-item__content">
    <div class="budget-item__top">
      <strong>{{ budget.name }}</strong>
      <b>{{ budget.percentage }}%</b>
    </div>

    <div class="budget-item__meta">
      <span class="budget-status" [attr.data-status]="budget.status">
        <i></i>
        {{ statusLabel }}
      </span>

      <span>
        {{ currencySymbol }} {{ budget.used | number:'1.0-2' }}
        de
        {{ currencySymbol }} {{ budget.budgeted | number:'1.0-2' }}
      </span>
    </div>

    <div class="budget-item__progress">
      <span
        [class.warning]="budget.status === 'WARNING'"
        [class.exceeded]="budget.status === 'EXCEEDED'"
        [style.width.%]="budget.percentage > 100 ? 100 : budget.percentage">
      </span>
    </div>
  </div>

  <ion-icon
    class="budget-item__arrow"
    src="assets/icon/right-inline.svg">
  </ion-icon>
</article>
