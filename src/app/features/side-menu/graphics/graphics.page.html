<ion-content class="graphics-page" [fullscreen]="true">
  <main class="graphics-container">
    <app-feature-header
      title="Gráficos"
      description="Consulta el resumen de tus finanzas por periodo y cuenta."
      imageSrc="assets/image/graphics-header.svg"
      imageAlt="Resumen financiero">
    </app-feature-header>

    <section class="graphics-filters" aria-label="Filtros del resumen">
      <app-filter-trigger
        label="Periodo"
        [value]="selectedPeriodLabel"
        [caption]="compactDateRange"
        (activated)="openPeriodSelector()">
      </app-filter-trigger>

      <app-filter-trigger
        label="Cuentas"
        [value]="selectedAccountLabel"
        [caption]="selectedAccounts.length + ' seleccionadas'"
        [disabled]="accounts.length === 0"
        (activated)="openAccountSelector()">
      </app-filter-trigger>
    </section>

    <app-section-card title="Indicadores del periodo" appearance="plain">
      <section class="metrics-grid" aria-label="Indicadores financieros">
        <article
          *ngFor="let metric of metrics"
          class="metric-card"
          [class]="'metric-card metric-card--' + metric.tone">
          <div class="metric-card__header">
            <span>{{ metric.label }}</span>
            <app-item-icon
              *ngIf="metric.icon"
              [icon]="metric.icon"
              [color]="metric.iconColor || 'var(--fv-primary)'"
              size="xs"
              variant="soft"
              aria-hidden="true">
            </app-item-icon>
          </div>
          <strong>{{ metric.amount < 0 ? '-' : '' }}{{ currency.symbol }} {{ (metric.amount < 0 ? -metric.amount : metric.amount) | number:'1.2-2' }}</strong>
        </article>
      </section>
    </app-section-card>

    <app-section-card title="Gráficas del periodo" appearance="plain">
      <div class="period-graphics__grid">
        <button
          *ngFor="let card of periodGraphicCards"
          type="button"
          class="graphic-link"
          (click)="openPeriodGraphic(card)">
          <span class="graphic-link__topline">
            <app-item-icon
              [icon]="card.icon"
              color="var(--fv-primary)"
              size="md"
              variant="soft"
              aria-hidden="true">
            </app-item-icon>
            <span class="graphic-link__arrow">
              <ion-icon src="assets/icon/right-inline.svg"></ion-icon>
            </span>
          </span>

          <span class="graphic-link__content">
            <small class="graphic-link__label">{{ card.label }}</small>
            <strong>{{ card.title }}</strong>
            <small class="graphic-link__description">{{ card.description }}</small>
          </span>
        </button>
      </div>
    </app-section-card>
  </main>
</ion-content>

<app-filter-modal
  [isOpen]="isPeriodSelectorOpen"
  title="Filtrar resumen"
  description="Selecciona el periodo que deseas consultar."
  applyText="Aplicar filtros"
  [selectedPeriod]="selectedPeriod"
  [selectedPeriodValue]="selectedPeriodValue"
  [selectedStartDate]="selectedStartDate"
  [selectedEndDate]="selectedEndDate"
  (modalClosed)="closePeriodSelector()"
  (filtersApplied)="applyFilters($event)">
</app-filter-modal>

<app-account-selector-modal
  [isOpen]="isAccountSelectorOpen"
  [accounts]="accounts"
  [selectionMode]="AccountSelectionMode.MULTIPLE"
  [selectedAccounts]="selectedAccounts"
  (accountsSelected)="applyAccountFilter($event)"
  (modalClosed)="closeAccountSelector()">
</app-account-selector-modal>
