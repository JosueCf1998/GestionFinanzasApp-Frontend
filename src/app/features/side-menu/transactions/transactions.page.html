<ion-content class="transactions-page" [fullscreen]="false" [forceOverscroll]="false">
  <main class="transactions">
    <app-feature-header
      title="Transacciones"
      description="Consulta y controla todos tus movimientos."
      imageSrc="assets/image/budget-chart.png">
    </app-feature-header>

    <section class="transaction-filters" aria-label="Filtros de transacciones">
      <button
        type="button"
        class="filter-trigger filter-trigger--period"
        (click)="openPeriodSelector()">
        <span class="filter-trigger__content">
          <small>Período</small>
          <strong>{{ selectedPeriodLabel }}</strong>
          <span>{{ compactDateRange }}</span>
        </span>

        <span class="filter-trigger__action">
          <ion-icon src="assets/icon/right-inline.svg"></ion-icon>
        </span>
      </button>

      <button
        type="button"
        class="filter-trigger filter-trigger--account"
        [disabled]="accounts.length === 0"
        (click)="openAccountSelector()">
        <span class="filter-trigger__content">
          <small>Cuenta</small>
          <strong>{{ selectedAccountLabel }}</strong>
          <span>Filtrar movimientos</span>
        </span>

        <span class="filter-trigger__action">
          <ion-icon src="assets/icon/right-inline.svg"></ion-icon>
        </span>
      </button>
    </section>

    <app-custom-segment
      [options]="transactionTypes"
      [model]="selectedType"
      (modelChange)="changeType($event)">
    </app-custom-segment>

    <app-period-summary-card
      *ngIf="!isLoading && !hasError && transactions.length > 0"
      title="Resumen del período"
      [totalLabel]="totalLabel"
      [totalAmount]="totalAmount"
      [metaValue]="accountCount"
      [metaLabel]="accountLabel"
      [chartSegments]="chartSegments"
      [chartAriaLabel]="chartAriaLabel"
      [chartTone]="selectedType === 'ingreso' ? 'success' : 'primary'"
      [periodLabel]="periodLabel"
      [currencySymbol]="currencySymbol">
    </app-period-summary-card>

    <app-section-card title="Movimientos" appearance="plain">
      <div *ngIf="isLoading" class="transactions-loading" aria-label="Cargando transacciones">
        <div *ngFor="let item of [1, 2, 3, 4]">
          <i></i>
          <span></span>
        </div>
      </div>

      <div *ngIf="!isLoading && !hasError && transactions.length" class="transactions-list">
        <app-amount-list-item
          *ngFor="let transaction of transactions; trackBy: trackByTransaction"
          [title]="transaction.category.name"
          [subtitle]="transaction.account.name"
          [icon]="transaction.category.icon"
          [color]="transaction.category.color"
          [amount]="transaction.amount"
          [amountTone]="transaction.type === 'ingreso' ? 'success' : 'default'"
          [currencySymbol]="currencySymbol">
        </app-amount-list-item>
      </div>

      <div *ngIf="!isLoading && !hasError && transactions.length === 0" class="transactions-empty">
        <app-item-icon
          icon="bills"
          color="var(--fv-primary)"
          size="lg"
          variant="soft"
          aria-hidden="true">
        </app-item-icon>
        <h3>Sin movimientos</h3>
        <p>Aún no tienes {{ selectedType === 'gasto' ? 'gastos' : 'ingresos' }} registrados.</p>
      </div>

      <div *ngIf="!isLoading && hasError" class="transactions-empty">
        <app-item-icon
          icon="alert-triangle"
          color="var(--fv-danger)"
          size="lg"
          variant="soft"
          aria-hidden="true">
        </app-item-icon>
        <h3>No se pudieron cargar</h3>
        <p>Revisa tu conexión e inténtalo nuevamente.</p>
        <button type="button" (click)="loadTransactions()">Reintentar</button>
      </div>
    </app-section-card>
  </main>

</ion-content>

<app-filter-modal
  [isOpen]="isPeriodSelectorOpen"
  title="Filtrar transacciones"
  description="Selecciona el período que deseas consultar."
  applyText="Aplicar filtros"
  [selectedPeriod]="selectedPeriod"
  [selectedPeriodValue]="selectedPeriodValue"
  [selectedStartDate]="selectedStartDate"
  [selectedEndDate]="selectedEndDate"
  (modalClosed)="closePeriodSelector()"
  (filtersApplied)="applyFilters($event)">
</app-filter-modal>

<app-account-selector-modal
  [isOpen]="isAccountSelectorOpen"
  [accounts]="accounts"
  [selectionMode]="AccountSelectionMode.MULTIPLE"
  [selectedAccounts]="selectedAccounts"
  (accountsSelected)="applyAccountFilter($event)"
  (modalClosed)="closeAccountSelector()">
</app-account-selector-modal>

<app-floating-action-button
  icon="add"
  ariaLabel="Registrar transacción"
  (clicked)="createTransaction()">
</app-floating-action-button>
