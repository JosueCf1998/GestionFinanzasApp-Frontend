<ion-header>
  <app-page-layout
    title="Crear categoría"
    (back)="backToCategories()">
  </app-page-layout>
</ion-header>

<ion-content [fullscreen]="false" class="create-category-page">
  <form class="create-category-form" (ngSubmit)="anadirCategoria()">
    <section class="category-preview" aria-label="Vista previa de la categoría">
      <div class="category-preview__identity">
        <app-item-icon
          [icon]="iconoCategoria"
          [color]="colorCategoria"
          size="lg"
          variant="soft">
        </app-item-icon>

        <div class="category-preview__content">
          <span>Vista previa</span>
          <h2>{{ nombreCategoria.trim() || 'Nueva categoría' }}</h2>
          <small [class.income]="tipoCategoria === 'ingreso'">
            {{ tipoCategoria === 'ingreso' ? 'Ingreso' : 'Gasto' }}
          </small>
        </div>
      </div>

    </section>

    <app-section-card title="Nombre de la categoría">
      <app-text-field
        name="nombreCategoria"
        placeholder="Ej. Alimentación"
        ariaLabel="Nombre de la categoría"
        [embedded]="true"
        [maxLength]="30"
        [required]="true"
        [(ngModel)]="nombreCategoria">
      </app-text-field>
    </app-section-card>

    <app-section-card class="category-type-card" title="Tipo de movimiento" appearance="plain">
      <app-custom-segment
        class="category-type-selector"
        [options]="categoryTypes"
        [(model)]="tipoCategoria">
      </app-custom-segment>

      <p class="type-description" [class.income]="tipoCategoria === 'ingreso'">
        {{ tipoCategoria === 'ingreso'
          ? 'Agrupa el dinero que entra a tus cuentas.'
          : 'Organiza y controla en qué utilizas tu dinero.' }}
      </p>
    </app-section-card>

    <app-section-card title="Apariencia" appearance="plain">
      <button
        type="button"
        class="personalization-row"
        (click)="openPersonalizationModal()">
        <app-item-icon
          [icon]="iconoCategoria"
          [color]="colorCategoria"
          size="md"
          variant="soft">
        </app-item-icon>

        <span>
          <strong>Icono y color</strong>
          <small>Personaliza cómo identificarás esta categoría</small>
        </span>

        <ion-icon src="assets/icon/right-inline.svg"></ion-icon>
      </button>
    </app-section-card>

    <app-info-banner
      title="Consejo FinVia"
      message="Una buena organización por categorías te ayuda a entender mejor tus hábitos financieros."
      symbol="✨">
    </app-info-banner>

    <div class="action-container">
      <app-button
        text="Crear categoría"
        type="submit"
        [disabled]="!puedeGuardar">
      </app-button>
    </div>
  </form>
</ion-content>

<app-personalization-modal
  [isOpen]="isPersonalizationModalOpen"
  [selectedIcon]="iconoSeleccionado"
  [selectedColor]="colorSeleccionado"
  [icons]="iconos"
  [colors]="colores"
  title="Personalizar categoría"
  description="Elige el icono y color que identificarán esta categoría."
  previewText="Así se identificará tu categoría"
  (modalClosed)="closePersonalizationModal()"
  (applied)="applyPersonalization($event)">
</app-personalization-modal>

<app-custom-alert
  *ngIf="showCustomAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en la categoría. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showCustomAlert = false"
  (onConfirm)="salirSinGuardar()">
</app-custom-alert>

<app-custom-alert
  *ngIf="showGenericAlert"
  header="Error"
  message="No se pudo crear la categoría. Inténtalo nuevamente."
  confirmText="Aceptar"
  (onConfirm)="showGenericAlert = false">
</app-custom-alert>
