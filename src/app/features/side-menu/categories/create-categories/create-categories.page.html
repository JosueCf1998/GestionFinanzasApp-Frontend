<app-page-layout
  title="Crear categoría"
  (back)="backToCategories()">
</app-page-layout>

<ion-content
  [fullscreen]="false"
  class="create-category-page">

  <form
    class="create-category-form"
    (ngSubmit)="anadirCategoria()">

    <!-- ==========================
         PREVIEW
         ========================== -->

    <div class="preview-inline">

      <div
        class="preview-inline-icon"
        [style.background]="colorCategoria">

        <ion-icon
          *ngIf="iconoCategoria"
          [src]="'assets/icon/' + iconoCategoria + '.svg'">
        </ion-icon>

      </div>

      <div class="preview-inline-content">

        <span class="preview-inline-title">

          {{
            nombreCategoria ||
            'Nueva categoría'
          }}

        </span>

        <span
          class="preview-inline-type"
          [class.income]="tipoCategoria === 'ingreso'">

          {{
            tipoCategoria === 'ingreso'
              ? 'Ingreso'
              : 'Gasto'
          }}

        </span>

      </div>

    </div>

    <!-- ==========================
         NOMBRE
         ========================== -->

    <div class="form-section">

      <label class="section-label">

        Nombre

      </label>

      <ion-input
        class="fv-input"
        type="text"
        name="nombreCategoria"
        maxlength="30"
        autocomplete="off"
        placeholder="Nombre de la categoría"
        [(ngModel)]="nombreCategoria"
        required>

      </ion-input>

    </div>

    <!-- ==========================
         TIPO
         ========================== -->

    <div class="form-section">

      <label class="section-label">

        Tipo de categoría

      </label>

      <app-custom-segment
        [options]="categoryTypes"
        [(model)]="tipoCategoria">

      </app-custom-segment>

    </div>

    <!-- ==========================
         ICONOS
         ========================== -->

    <div class="form-section">

      <label class="section-label">

        Símbolo

      </label>

      <div class="icons-grid">

        <button
          *ngFor="let icon of iconos"
          type="button"
          class="icon-button"
          [class.selected]="icon.archivo === iconoSeleccionado"
          [attr.aria-label]="icon.nombre"
          (click)="seleccionarIcono(icon)">

          <ion-icon
            [src]="'assets/icon/' + icon.archivo + '.svg'">
          </ion-icon>

        </button>

      </div>

    </div>

    <!-- ==========================
         COLORES
         ========================== -->

    <div class="form-section">

      <label class="section-label">

        Color

      </label>

      <div class="colors-grid">

        <button
          *ngFor="let color of colores"
          type="button"
          class="color-button"
          [style.background]="color.valor"
          [class.selected]="color.valor === colorSeleccionado"
          [attr.aria-label]="color.nombre"
          (click)="seleccionarColor(color)">

          <ion-icon
            *ngIf="color.valor === colorSeleccionado"
            src="assets/icon/check.svg">
          </ion-icon>

        </button>

      </div>

    </div>

    <!-- ==========================
         ACCIONES
         ========================== -->

    <ion-button
      expand="block"
      class="save-button"
      type="submit"
      [disabled]="!puedeGuardar">

      Guardar categoría

    </ion-button>

  </form>

</ion-content>

<!-- ==========================
     ALERTA CAMBIOS
     ========================== -->

<app-custom-alert
  *ngIf="showCustomAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en la categoría. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showCustomAlert = false"
  (onConfirm)="salirSinGuardar()">
</app-custom-alert>

<!-- ==========================
     ALERTA ERROR
     ========================== -->

<app-custom-alert
  *ngIf="showGenericAlert"
  header="Error"
  message="No se pudo crear la categoría. Inténtalo nuevamente."
  confirmText="Aceptar"
  (onConfirm)="showGenericAlert = false">
</app-custom-alert>
