<ion-header
  class="create-category-header">


  <!-- ==========================================================
       HEADER
       ========================================================== -->

  <app-page-layout
    title="Crear categoría"
    (back)="backToCategories()">
  </app-page-layout>


</ion-header>

<ion-content
  [fullscreen]="false"
  class="create-category-page">

  <!-- ==========================================================
       FORM
       ========================================================== -->

  <form
    class="create-category-form"
    (ngSubmit)="anadirCategoria()">

    <!-- ==========================================================
         HERO PREVIEW
         ========================================================== -->

    <section class="category-preview">

      <app-item-icon
        *ngIf="iconoCategoria"
        [icon]="iconoCategoria"
        [color]="colorCategoria"
        size="xl"
        variant="soft">
      </app-item-icon>

      <h2 class="preview-title">

        {{
          nombreCategoria ||
          'Nueva categoría'
        }}

      </h2>

      <span
        class="preview-type"
        [class.income]="tipoCategoria === 'ingreso'">

        {{
          tipoCategoria === 'ingreso'
            ? 'Ingreso'
            : 'Gasto'
        }}

      </span>

    </section>

    <!-- ==========================================================
         NOMBRE
         ========================================================== -->

    <section class="form-section">

      <label class="section-label">

        Nombre

      </label>

      <ion-input
        class="fv-input"
        type="text"
        name="nombreCategoria"
        maxlength="30"
        autocomplete="off"
        placeholder="Ej. Alimentación"
        [(ngModel)]="nombreCategoria"
        required>

      </ion-input>

    </section>

    <!-- ==========================================================
         TIPO
         ========================================================== -->

    <section class="form-section">

      <div class="section-header">

        <label class="section-label">

          Tipo de categoría

        </label>

      </div>

      <app-custom-segment
        [options]="categoryTypes"
        [(model)]="tipoCategoria">

      </app-custom-segment>

    </section>

    <!-- ==========================================================
         ICONOS
         ========================================================== -->

    <section class="form-section">

      <div class="section-header">

        <label class="section-label">

          Ícono

        </label>

        <span>

          {{ iconos.length }} disponibles

        </span>

      </div>

      <div class="icons-grid">

        <button
          *ngFor="let icon of iconos"
          type="button"
          class="icon-button"
          [class.selected]="icon.icon === iconoSeleccionado"
          [attr.aria-label]="icon.label"
          (click)="seleccionarIcono(icon)">

          <app-item-icon
            [icon]="icon.icon"
            [color]="colorCategoria"
            size="sm"
            variant="soft"
            [selected]="icon.icon === iconoSeleccionado">
          </app-item-icon>

        </button>

      </div>

    </section>

    <!-- ==========================================================
         COLORES
         ========================================================== -->

    <section class="form-section">

      <div class="section-header">

        <label class="section-label">

          Color

        </label>

        <span>

          {{ colores.length }} disponibles

        </span>

      </div>

      <div class="colors-grid">

        <button
          *ngFor="let color of colores"
          type="button"
          class="color-button"
          [style.background]="color.value"
          [class.selected]="color.value === colorSeleccionado"
          [attr.aria-label]="color.label"
          (click)="seleccionarColor(color)">

          <ion-icon
            *ngIf="color.value === colorSeleccionado"
            src="assets/icon/check.svg">
          </ion-icon>

        </button>

      </div>

    </section>

    <!-- ==========================================================
         ACTIONS
         ========================================================== -->

    <div class="action-container">

      <app-button
        text="Crear categoría"
        type="submit"
        [disabled]="!puedeGuardar">
      </app-button>

    </div>

  </form>

</ion-content>

<!-- ==========================================================
     ALERTA CAMBIOS
     ========================================================== -->

<app-custom-alert
  *ngIf="showCustomAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en la categoría. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showCustomAlert = false"
  (onConfirm)="salirSinGuardar()">
</app-custom-alert>

<!-- ==========================================================
     ALERTA ERROR
     ========================================================== -->

<app-custom-alert
  *ngIf="showGenericAlert"
  header="Error"
  message="No se pudo crear la categoría. Inténtalo nuevamente."
  confirmText="Aceptar"
  (onConfirm)="showGenericAlert = false">
</app-custom-alert>
