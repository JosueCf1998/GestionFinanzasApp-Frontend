<ion-header>

  <app-page-layout
    title="Editar categoría"
    (back)="backToCategories()">
  </app-page-layout>

</ion-header>

<ion-content
  [fullscreen]="false"
  class="edit-category-page">

  <!-- ==========================================================
       FORM
       ========================================================== -->

  <form
    class="edit-category-form"
    (ngSubmit)="anadirCategoria()">

    <!-- ==========================================================
         CATEGORY PREVIEW
         ========================================================== -->

    <section class="category-preview">

      <div
        class="preview-icon"
        [style.background]="colorCategoria">

        <ion-icon
          *ngIf="iconoCategoria"
          [src]="'assets/icon/' + iconoCategoria + '.svg'">
        </ion-icon>

      </div>

      <h2 class="preview-title">

        {{
          nombreCategoria ||
          'Categoría'
        }}

      </h2>

      <span
        class="preview-type"
        [class.income]="tipoCategoria === 'ingresos'">

        {{
          tipoCategoria === 'ingresos'
            ? 'Ingreso'
            : 'Gasto'
        }}

      </span>

    </section>

    <!-- ==========================================================
         NAME
         ========================================================== -->

    <section class="form-section">

      <label class="section-label">

        Nombre

      </label>

      <ion-input
        class="fv-input"
        type="text"
        name="nombreCategoria"
        maxlength="30"
        autocomplete="off"
        placeholder="Ej. Alimentación"
        [(ngModel)]="nombreCategoria"
        (ionInput)="onInputNombreCategoria($event)"
        required>

      </ion-input>

    </section>

    <!-- ==========================================================
         TYPE
         ========================================================== -->

    <section class="form-section">

      <label class="section-label">

        Tipo de categoría

      </label>

      <div class="readonly-type">

        <span
          class="preview-type"
          [class.income]="tipoCategoria === 'ingresos'">

          {{
            tipoCategoria === 'ingresos'
              ? 'Ingreso'
              : 'Gasto'
          }}

        </span>

      </div>

    </section>

    <!-- ==========================================================
         ICONS
         ========================================================== -->

    <section class="form-section">

      <div class="section-header">

        <label class="section-label">

          Ícono

        </label>

        <span>

          {{ iconos.length }} disponibles

        </span>

      </div>

      <div class="icons-grid">

        <button
          *ngFor="let icon of iconos"
          type="button"
          class="icon-button"
          [class.selected]="icon.archivo === iconoSeleccionado"
          [attr.aria-label]="icon.nombre"
          (click)="seleccionarIcono(icon)">

          <ion-icon
            [src]="'assets/icon/' + icon.archivo + '.svg'">
          </ion-icon>

        </button>

      </div>

    </section>

    <!-- ==========================================================
         COLORS
         ========================================================== -->

    <section class="form-section">

      <div class="section-header">

        <label class="section-label">

          Color

        </label>

        <span>

          {{ colores.length }} disponibles

        </span>

      </div>

      <div class="colors-grid">

        <button
          *ngFor="let color of colores"
          type="button"
          class="color-button"
          [style.background]="color.valor"
          [class.selected]="color.valor === colorSeleccionado"
          [attr.aria-label]="color.nombre"
          (click)="seleccionarColor(color)">

          <ion-icon
            *ngIf="color.valor === colorSeleccionado"
            src="assets/icon/check.svg">

          </ion-icon>

        </button>

      </div>

    </section>

    <!-- ==========================================================
         ACTIONS
         ========================================================== -->

    <div class="action-container">

      <app-button
        text="Guardar cambios"
        type="submit"
        [disabled]="!puedeGuardar">

      </app-button>

      <app-button
        text="Eliminar categoría"
        icon="trash"
        variant="danger"
        (clicked)="eliminarCategoria()">

      </app-button>

    </div>

  </form>

</ion-content>

<!-- ==========================================================
     ALERTA CAMBIOS
     ========================================================== -->

<app-custom-alert
  *ngIf="showExitAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en la categoría. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="cerrarAlert()"
  (onConfirm)="salirSinGuardar()">
</app-custom-alert>

<!-- ==========================================================
     ALERTA ELIMINAR
     ========================================================== -->

<app-custom-alert
  *ngIf="showDeleteAlert"
  header="Eliminar categoría"
  message="Esta acción no se puede deshacer. ¿Deseas continuar?"
  cancelText="Cancelar"
  confirmText="Eliminar"
  (onCancel)="cerrarAlert()"
  (onConfirm)="confirmarEliminacion()">
</app-custom-alert>

<!-- ==========================================================
     ALERTA ERROR
     ========================================================== -->

<app-custom-alert
  *ngIf="showGenericAlert"
  header="Error"
  message="Ocurrió un error al procesar la solicitud. Inténtalo nuevamente."
  confirmText="Aceptar"
  (onConfirm)="cerrarAlert()">
</app-custom-alert>

<!-- ==========================================================
     ALERTA MENSAJE
     ========================================================== -->

<app-custom-alert
  *ngIf="showUnauthorizedAlert"
  header="Error"
  [message]="messageError"
  confirmText="Aceptar"
  (onConfirm)="cerrarAlert()">
</app-custom-alert>
