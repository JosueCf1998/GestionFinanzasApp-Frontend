<ion-content
  [fullscreen]="true"
  class="categories-page">

  <app-custom-alert
    *ngIf="showGenericAlert"
    [header]="'Error'"
    [message]="'No se pudieron cargar las categorías. Por favor, intenta nuevamente.'"
    [confirmText]="'Aceptar'"
    (onConfirm)="cerrarAlert()">
  </app-custom-alert>

  <div class="page-container">

    <app-feature-header
      title="Categorías"
      description="Organiza tus ingresos y gastos para entender mejor tus finanzas."
      imageSrc="assets/image/categories-header.svg"
      imageAlt="Categorías">
    </app-feature-header>

    <!-- SEGMENT -->

    <div class="segment-container">

      <app-custom-segment
        [options]="dataTabs"
        [(model)]="segment"
        segmentClass="main-tabs"
        (modelChange)="onSegmentChanged($event)">
      </app-custom-segment>

    </div>

    <!-- HEADER -->

    <div class="section-header">

      <h2 class="text-subtitle">
        Mis categorías
      </h2>

    </div>

    <!-- GRID -->

    <div class="categories-grid">

      <ng-container
        *ngIf="categoriasActuales.length > 0; else onlyAdd">

        <div
          class="category-item"
          *ngFor="let cat of categoriasActuales"
          (click)="goToEditCategories(segment, cat)">

          <app-item-icon
            [icon]="cat.icono"
            [color]="cat.color"
            size="lg"
            variant="solid">
          </app-item-icon>

          <span class="category-name">
            {{ cat.nombre }}
          </span>

        </div>

        <div
          class="category-item add-category"
          (click)="goToCreateCategories(segment)">

          <div class="category-icon add-icon">

            <ion-icon
              src="assets/icon/add.svg">
            </ion-icon>

          </div>

          <span class="category-name">
            Agregar
          </span>

        </div>

      </ng-container>

      <ng-template #onlyAdd>

        <div
          class="category-item add-category"
          (click)="goToCreateCategories(segment)">

          <div class="category-icon add-icon">

            <ion-icon
              src="assets/icon/add.svg">
            </ion-icon>

          </div>

          <span class="category-name">
            Agregar
          </span>

        </div>

      </ng-template>

    </div>

  </div>

  <!-- FLOATING INSIGHT -->

  <div class="floating-tip">

    <div class="tip-card">

      <div class="tip-header">

        <div class="tip-badge">
          ✨
        </div>

        <span class="tip-title">

          Consejo FinVia

        </span>

      </div>

      <p class="tip-description">

        Mantén organizadas tus categorías
        para obtener reportes más claros
        y un mejor control financiero.

      </p>

    </div>

  </div>

</ion-content>
