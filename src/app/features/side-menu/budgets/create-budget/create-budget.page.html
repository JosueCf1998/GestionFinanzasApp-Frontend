<ion-header>
  <app-page-layout
    [title]="isEditMode ? 'Editar presupuesto' : 'Crear presupuesto'"
    [showBack]="true"
    [loading]="isSaving || isDeleting"
    (back)="backToBudgets()">
  </app-page-layout>
</ion-header>

<ion-content [fullscreen]="false" class="create-budget-page">
  <form class="create-budget-form" (ngSubmit)="saveBudget()">
    <app-budget-preview-card
      [name]="name"
      [icon]="selectedIcon"
      [color]="selectedColor"
      [budgetTotal]="categoryAllocationTotal"
      [categoryCount]="selectedCategoryAllocations.length"
      [startDate]="periodSelection.startDate"
      [endDate]="periodSelection.endDate"
      (personalize)="openPersonalizationModal()">
    </app-budget-preview-card>

    <app-section-card title="Nombre del Presupuesto">
      <app-text-field
        name="name"
        [maxLength]="30"
        [embedded]="true"
        ariaLabel="Nombre del presupuesto"
        placeholder="Ej. Vacaciones en familia"
        [(ngModel)]="name"
        [required]="true">
      </app-text-field>
    </app-section-card>

    <app-section-card title="Programación">
      <app-selection-summary
        [primaryText]="formattedDateRange"
        [secondaryText]="periodLabel"
        ariaLabel="Cambiar las fechas del presupuesto"
        fallbackIcon="assets/icon/calendar.svg"
        (activated)="openPeriodModal()">
      </app-selection-summary>
    </app-section-card>

    <app-section-card title="Cuentas">
      <app-selection-summary
        [primaryText]="selectedAccountsTitle"
        [secondaryText]="selectedAccountsLabel"
        ariaLabel="Seleccionar cuentas vinculadas"
        fallbackIcon="assets/icon/bank.svg"
        [items]="accountSummaryItems"
        (activated)="openAccountModal()">
      </app-selection-summary>
    </app-section-card>

    <app-warning-message
      *ngIf="hasInsufficientAccountBalance"
      title="Revisa la cobertura"
      [message]="accountBalanceWarningMessage">
    </app-warning-message>

    <app-section-card title="Categorías">
      <app-selection-summary
        [primaryText]="selectedCategoriesTitle"
        [secondaryText]="selectedCategoriesLabel"
        ariaLabel="Seleccionar categorías del presupuesto"
        fallbackIcon="assets/icon/category.svg"
        [items]="categorySummaryItems"
        (activated)="openCategoryModal()">
      </app-selection-summary>
    </app-section-card>

    <app-section-card title="Notas (opcional)">
      <app-text-field
        name="notes"
        [embedded]="true"
        [multiline]="true"
        [rows]="3"
        [maxLength]="200"
        ariaLabel="Notas del presupuesto"
        placeholder="Añade un detalle o recordatorio para este presupuesto"
        [(ngModel)]="notes">
      </app-text-field>
    </app-section-card>

    <app-info-banner
      *ngIf="!isEditMode"
      title="Consejo FinVia"
      [message]="budgetAdviceMessage"
      symbol="✨">
    </app-info-banner>

    <div class="action-container">
      <app-button
        [text]="isSaving
          ? (isEditMode ? 'Guardando...' : 'Creando...')
          : (isEditMode ? 'Guardar cambios' : 'Crear presupuesto')"
        type="submit"
        [loading]="isSaving"
        [disabled]="!canSave">
      </app-button>

      <app-button
        *ngIf="isEditMode && canDeleteBudget"
        text="Eliminar presupuesto"
        icon="trash"
        variant="danger"
        [loading]="isDeleting"
        [disabled]="isSaving || isDeleting"
        (clicked)="requestDeleteBudget()">
      </app-button>
    </div>
  </form>
</ion-content>

<app-filter-modal
  [isOpen]="isPeriodModalOpen"
  title="Elige las fechas"
  description="Selecciona durante cuánto tiempo controlarás este presupuesto."
  applyText="Aplicar fechas"
  [selectedPeriod]="periodSelection.period"
  [selectedPeriodValue]="periodSelection.periodValue"
  [selectedStartDate]="periodSelection.startDate"
  [selectedEndDate]="periodSelection.endDate"
  (modalClosed)="closePeriodModal()"
  (filtersApplied)="applyPeriod($event)">
</app-filter-modal>

<app-account-selector-modal
  [isOpen]="isAccountModalOpen"
  [accounts]="accounts"
  [selectionMode]="AccountSelectionMode.MULTIPLE"
  [selectedAccounts]="selectedAccounts"
  (accountsSelected)="applyAccounts($event)"
  (modalClosed)="closeAccountModal()">
</app-account-selector-modal>

<app-category-selector-modal
  [isOpen]="isCategoryModalOpen"
  [categories]="categories"
  [selectedAllocations]="selectedCategoryAllocations"
  [availableBalance]="selectedAccounts.length ? selectedAccountBalanceTotal : null"
  (allocationsSelected)="applyCategoryAllocations($event)"
  (modalClosed)="closeCategoryModal()">
</app-category-selector-modal>

<app-personalization-modal
  [isOpen]="isPersonalizationModalOpen"
  [selectedIcon]="selectedIcon"
  [selectedColor]="selectedColor"
  [icons]="icons"
  [colors]="colors"
  (modalClosed)="closePersonalizationModal()"
  (applied)="applyPersonalization($event)">
</app-personalization-modal>

<app-budget-success-modal
  [isOpen]="isSuccessModalOpen"
  [budgetName]="name"
  [budgetTotal]="categoryAllocationTotal"
  [dateRange]="formattedDateRange"
  [accountsLabel]="selectedAccountsLabel"
  [categoriesLabel]="selectedCategoriesLabel"
  [note]="notes.trim()"
  [mode]="isEditMode ? 'edit' : 'create'"
  (viewBudgets)="viewBudgets()">
</app-budget-success-modal>

<app-custom-alert
  *ngIf="showUnsavedAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en el presupuesto. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showUnsavedAlert = false"
  (onConfirm)="leaveWithoutSaving()">
</app-custom-alert>

<app-custom-alert
  *ngIf="showDeleteAlert"
  header="Eliminar presupuesto"
  [message]="'Esta acción eliminará definitivamente “' + name.trim() + '” y no se puede deshacer. ¿Deseas continuar?'"
  cancelText="Cancelar"
  confirmText="Eliminar"
  (onCancel)="cancelDeleteBudget()"
  (onConfirm)="confirmDeleteBudget()">
</app-custom-alert>

<app-custom-alert
  *ngIf="showDeleteError"
  header="No se pudo eliminar"
  message="Ocurrió un error al eliminar el presupuesto. Inténtalo nuevamente."
  confirmText="Aceptar"
  (onConfirm)="showDeleteError = false">
</app-custom-alert>

<app-custom-alert
  *ngIf="showDataError"
  header="No se pudieron cargar los datos"
  message="No fue posible obtener las cuentas o categorías. Inténtalo nuevamente."
  confirmText="Aceptar"
  (onConfirm)="showDataError = false">
</app-custom-alert>

<app-custom-alert
  *ngIf="showAccountBalanceRequiredAlert"
  header="Cuenta sin saldo disponible"
  message="Selecciona primero una cuenta con un saldo mayor que cero antes de asignar montos a las categorías."
  confirmText="Aceptar"
  (onConfirm)="showAccountBalanceRequiredAlert = false">
</app-custom-alert>

<app-custom-alert
  *ngIf="showErrorAlert"
  header="Error"
  [message]="isEditMode
    ? 'No se pudo actualizar el presupuesto. Inténtalo nuevamente.'
    : 'No se pudo crear el presupuesto. Inténtalo nuevamente.'"
  confirmText="Aceptar"
  (onConfirm)="showErrorAlert = false">
</app-custom-alert>
