<ion-header>
  <app-page-layout
    title="Nuevo presupuesto"
    [showBack]="true"
    [loading]="isSaving"
    (back)="backToBudgets()">
  </app-page-layout>
</ion-header>

<ion-content [fullscreen]="false" class="create-budget-page">
  <form class="create-budget-form" (ngSubmit)="saveBudget()">
    <section class="identity-preview" aria-label="Vista previa del presupuesto">
      <div class="identity-icon">
        <app-item-icon
          [icon]="selectedIcon"
          [color]="selectedColor"
          size="xl"
          variant="soft">
        </app-item-icon>
        <span class="identity-edit">
          <ion-icon src="assets/icon/edit.svg"></ion-icon>
        </span>
      </div>

      <h2>{{ name || 'Nuevo presupuesto' }}</h2>
      <span>{{ periodLabel }} · {{ formattedDateRange }}</span>
    </section>

    <section class="field-card">
      <div class="field-card__icon">
        <ion-icon src="assets/icon/budget-wallet.svg"></ion-icon>
      </div>
      <div class="field-card__content">
        <label for="budget-name">Nombre del presupuesto</label>
        <ion-input
          id="budget-name"
          class="clean-input"
          type="text"
          name="name"
          maxlength="40"
          autocomplete="off"
          placeholder="Ej. Vacaciones en familia"
          [(ngModel)]="name"
          required>
        </ion-input>
      </div>
    </section>

    <section class="field-card field-card--amount">
      <div class="field-card__icon">
        <ion-icon src="assets/icon/wallet.svg"></ion-icon>
      </div>
      <div class="field-card__content">
        <label>Presupuesto total</label>
        <app-amount-input
          [(ngModel)]="amount"
          name="amount"
          currencyCode="PEN"
          variant="enhanced"
          [required]="true">
        </app-amount-input>
      </div>
    </section>

    <app-section-card
      class="period-card"
      title="Periodo del presupuesto">
      <div class="period-summary">
        <span>{{ periodLabel }}</span>
        <strong>{{ formattedDateRange }}</strong>
      </div>

      <app-period-picker
        [period]="periodSelection.period"
        [periodValue]="periodSelection.periodValue"
        [startDate]="periodSelection.startDate"
        [endDate]="periodSelection.endDate"
        (valueChange)="updatePeriod($event)">
      </app-period-picker>
    </app-section-card>

    <app-section-card
      class="personalization-card"
      title="Color e icono">
      <app-icon-picker
        [options]="icons"
        [color]="selectedColor"
        [(selected)]="selectedIcon">
      </app-icon-picker>

      <app-color-picker
        class="color-picker"
        [options]="colors"
        [(selected)]="selectedColor">
      </app-color-picker>
    </app-section-card>

    <aside class="budget-tip">
      <ion-icon src="assets/icon/question.svg"></ion-icon>
      <p>
        El monto se controlará únicamente durante el periodo seleccionado.
        Podrás revisar su avance desde Presupuestos.
      </p>
    </aside>

    <div class="action-container">
      <app-button
        [text]="isSaving ? 'Creando...' : 'Crear presupuesto'"
        type="submit"
        [loading]="isSaving"
        [disabled]="!canSave">
      </app-button>
    </div>
  </form>
</ion-content>

<app-custom-alert
  *ngIf="showUnsavedAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en el presupuesto. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showUnsavedAlert = false"
  (onConfirm)="leaveWithoutSaving()">
</app-custom-alert>

<app-custom-alert
  *ngIf="showErrorAlert"
  header="Error"
  message="No se pudo crear el presupuesto. Inténtalo nuevamente."
  confirmText="Aceptar"
  (onConfirm)="showErrorAlert = false">
</app-custom-alert>
