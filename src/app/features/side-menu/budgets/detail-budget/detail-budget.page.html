<ion-header>
  <app-page-layout
    title="Detalle del presupuesto"
    [showBack]="true"
    (back)="backToBudgets()">
  </app-page-layout>
</ion-header>

<ion-content [fullscreen]="false" class="detail-budget-page">
  <main class="detail-budget">
    <app-budget-summary-card
      mode="budget"
      [title]="budget.name"
      [dateRange]="dateRangeLabel"
      [icon]="budget.icon"
      [color]="budget.color"
      [status]="budget.status"
      [statusLabel]="statusLabel"
      [progress]="budget.percentage"
      [budgeted]="budget.budgeted"
      [used]="budget.used"
      [balance]="isExceeded ? exceededAmount : availableAmount"
      [balanceLabel]="isExceeded ? 'Excedido' : 'Disponible'"
      [currencySymbol]="currency === 'PEN' ? 'S/' : currency">
    </app-budget-summary-card>

    <app-warning-message
      *ngIf="isExceeded"
      title="Presupuesto excedido"
      [message]="'Has superado el monto planificado por ' + (exceededAmount | currency:currency:'symbol-narrow':'1.2-2') + '.'">
    </app-warning-message>

    <app-section-card title="Cuentas">
      <app-selection-summary
        [primaryText]="budgetAccounts.length === 1 ? budgetAccounts[0].name : linkedAccountsTitle"
        [secondaryText]="budgetAccounts.length === 1 ? 'Saldo de la cuenta' : linkedAccountsLabel"
        ariaLabel="Cuentas vinculadas al presupuesto"
        fallbackIcon="assets/icon/bank.svg"
        [items]="budgetAccounts"
        [interactive]="budgetAccounts.length > 1"
        [showArrow]="false"
        [actionText]="budgetAccounts.length > 1 ? 'Ver detalles' : ''"
        [actionOnly]="true"
        [trailingText]="budgetAccounts.length === 1 ? currency + (budgetAccounts[0].amount | number:'1.2-2') : ''"
        (activated)="openAccountDetails()">
      </app-selection-summary>
    </app-section-card>

    <app-section-card
      title="Categorías"
      appearance="plain">
      <div class="categories-list">
        <app-progress-list-item
          *ngFor="let category of categoryBudgets; trackBy: trackByCategory"
          [item]="category"
          [currencySymbol]="currency === 'PEN' ? 'S/' : currency">
        </app-progress-list-item>
      </div>
    </app-section-card>

  </main>
</ion-content>

<app-account-details-modal
  [isOpen]="isAccountDetailsModalOpen"
  [accounts]="budgetAccounts"
  [currency]="currency"
  (closed)="closeAccountDetails()">
</app-account-details-modal>
