<ion-content class="budgets-content" [fullscreen]="true">
  <main class="budgets-container">

    <app-feature-header
      title="Presupuestos"
      description="Controla tus gastos sin exceder tus límites."
      imageSrc="assets/image/budget-chart.png">
    </app-feature-header>

    <section class="budget-filters" aria-label="Filtros del presupuesto">
      <button
        type="button"
        class="filter-trigger"
        (click)="openPeriodSelector()">
        <span class="filter-trigger__content">
          <small>
            <ion-icon src="assets/icon/calendar.svg"></ion-icon>
            Periodo de consulta
          </small>
          <strong class="filter-trigger__date">{{ selectedDate }}</strong>
        </span>

        <span class="filter-trigger__period">{{ selectedPeriodLabel }}</span>

        <span class="filter-trigger__action">
          <ion-icon src="assets/icon/right-inline.svg"></ion-icon>
        </span>
      </button>
    </section>

    <div *ngIf="budgets.length > 0" class="summary-section-heading">
      <span>Resumen del periodo</span>
    </div>

    <app-budget-summary-card
      *ngIf="budgets.length > 0"
      class="period-summary"
      mode="period"
      [title]="summaryBalanceLabel"
      [headline]="currency.symbol + ' ' + (summaryBalance | number:'1.2-2')"
      icon="wallet"
      [progress]="summary.percentage"
      [budgeted]="summary.budgeted"
      [used]="summary.used"
      [currencySymbol]="currency.symbol">
    </app-budget-summary-card>

    <section class="budget-list-section">
      <header class="list-heading">
        <h2>Mis presupuestos</h2>
      </header>

      <div class="budget-list">
        <app-budget-list-item
          *ngFor="let budget of budgets; trackBy: trackByBudget"
          [budget]="budget"
          [currencySymbol]="currency.symbol"
          (selected)="openBudget($event)">
        </app-budget-list-item>
      </div>

      <div
        *ngIf="(loadingService.loading$ | async) === false && budgets.length === 0"
        class="budget-empty-state">
        <app-item-icon
          icon="wallet"
          color="var(--fv-primary)"
          size="lg"
          shape="rounded"
          variant="soft">
        </app-item-icon>

        <h3>No hay presupuestos en este periodo</h3>
        <p>Selecciona otro periodo para consultar tus presupuestos.</p>

        <app-button
          class="budget-empty-state__action"
          text="Cambiar periodo"
          icon="calendar"
          variant="secondary"
          size="compact"
          expand="auto"
          (clicked)="openPeriodSelector()">
        </app-button>
      </div>
    </section>

  </main>

  <app-floating-action-button
    ariaLabel="Crear presupuesto"
    (clicked)="createBudget()">
  </app-floating-action-button>

  <app-filter-modal
    [isOpen]="isPeriodSelectorOpen"
    title="Filtrar presupuestos"
    description=""
    applyText="Aplicar filtros"
    [selectedPeriod]="selectedPeriod"
    [selectedPeriodValue]="selectedPeriodValue"
    [selectedStartDate]="selectedStartDate"
    [selectedEndDate]="selectedEndDate"
    (modalClosed)="closePeriodSelector()"
    (filtersApplied)="applyFilters($event)">
  </app-filter-modal>
</ion-content>
