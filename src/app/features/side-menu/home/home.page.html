<ion-content [fullscreen]="true" scroll-y="false">
  <div class="home-content">
    <!-- Saldo principal -->
    <div class="balance-container">
      <h1 class="text-display-large" (click)="openModal()">S/. 200.00</h1>
      <p class="text-body text-secondary">Cuenta: Principal</p>
    </div>
  
    <!-- Tabs de Gastos e Ingresos -->
    <div class="">
      <app-custom-segment
        [options]="dataTabs"
        [(model)]="segment"
        segmentClass="main-tabs"
        (modelChange)="onSegmentChanged($event)">
      </app-custom-segment>
    </div>
  
    <!-- Lista de categorías -->
    <ion-list class="categories-list">
      <ng-container *ngIf="categoriesWithAmounts.length > 0; else noCategories">
        <ion-item *ngFor="let category of categoriesWithAmounts">
          <div slot="start" class="category-icon" [style.background]="category.color">
            <ion-icon [src]="'assets/icon/' + category.icono + '.svg'"></ion-icon>
          </div>
          <ion-label class="text-body">{{ category.nombre }}</ion-label>
          <ion-note slot="end" class="text-body-bold">S/. {{ category.totalAmount | number:'1.2-2' }}</ion-note>
        </ion-item>
      </ng-container>
      <ng-template #noCategories>
        <ion-item>
          <ion-label class="text-body" color="medium">No hay transacciones en esta categoría</ion-label>
        </ion-item>
      </ng-template>
    </ion-list>
  </div>

  <!-- Modal -->
  <ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()" cssClass="custom-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title class="text-subtitle">Modificar Monto</ion-title>
          <ion-buttons slot="end">
            <ion-button fill="clear" (click)="closeModal()">
              <ion-icon name="close-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <div class="modal-content">
          <ion-item>
            <ion-label position="floating" class="text-body">Nuevo Monto</ion-label>
            <ion-input type="number" [(ngModel)]="newAmount"></ion-input>
          </ion-item>
          <ion-button expand="block" shape="round" color="primary" class="text-button" (click)="updateAmount()">Guardar</ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>

  <!-- Botón flotante -->
  <button class="fab-button" (click)="navigateToCreateTransac()">
    <ion-icon src="assets/icon/add.svg"></ion-icon>
  </button>
  
</ion-content>
