<ion-content [fullscreen]="true" scroll-y="false">
  <div class="home-content">
    <!-- Saldo principal -->
    <div class="balance-container">
      <h1 (click)="openModal()">S/. 200.00</h1>
      <p>Cuenta: Principal</p>
    </div>
  
    <!-- Tabs de Gastos e Ingresos -->
    <div class="">
      <app-custom-segment
        [options]="dataTabs"
        [(model)]="segment"
        segmentClass="main-tabs"
        (modelChange)="onSegmentChanged($event)">
      </app-custom-segment>
    </div>
  
    <!-- Lista de categorías -->
    <ion-list class="categories-list">
      <ion-item>
        <ion-icon name="heart-outline" slot="start" color="danger"></ion-icon>
        <ion-label>Salud</ion-label>
        <ion-note slot="end">S/. 45.00</ion-note>
      </ion-item>
      <ion-item>
        <ion-icon name="heart-outline" slot="start" color="danger"></ion-icon>
        <ion-label>Estudios</ion-label>
        <ion-note slot="end">S/. 245.00</ion-note>
      </ion-item>
    </ion-list>
  </div>

  <!-- Modal -->
  <ion-modal [isOpen]="isModalOpen" (didDismiss)="closeModal()" cssClass="custom-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Modificar Monto</ion-title>
          <ion-buttons slot="end">
            <ion-button fill="clear" (click)="closeModal()">
              <ion-icon name="close-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <div class="modal-content">
          <ion-item>
            <ion-label position="floating">Nuevo Monto</ion-label>
            <ion-input type="number" [(ngModel)]="newAmount"></ion-input>
          </ion-item>
          <ion-button expand="block" shape="round" color="primary" (click)="updateAmount()">Guardar</ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>

  <!-- Botón flotante -->
  <button class="fab-button" (click)="navigateToCreateTransac()">
    <ion-icon src="assets/icon/add.svg"></ion-icon>
  </button>
  
</ion-content>
