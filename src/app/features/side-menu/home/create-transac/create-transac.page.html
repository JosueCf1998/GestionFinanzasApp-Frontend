<ion-header>
  <ion-toolbar class="side-menu" color="side-menu">
    <ion-buttons slot="start">
      <button class="atras-btn" type="button" (click)="backToCategories()">
        <ion-icon src="assets/icon/left.svg"></ion-icon>
      </button>
    </ion-buttons>
    <ion-title class="header-title">Nueva Transacción</ion-title>
    <ion-buttons slot="end">
      <!-- Acciones adicionales -->
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" scroll-y="false">
  <div class="transaction-container">
    <!-- Formulario -->
    <form class="transaction-form">
      <!-- Cuenta -->
      <div class="transfer-section">
        <label class="transfer-label">
          <ion-icon src="assets/icon/wallet.svg" class="label-icon"></ion-icon>
          Cuenta
        </label>
        <button type="button" class="account-btn" (click)="seleccionarCuenta()">
          <div class="account-btn-content" [class.selected]="cuentaSeleccionada">
            <div class="account-info">
              <ion-icon src="assets/icon/card.svg" class="account-icon"></ion-icon>
              <span class="account-name">{{ cuentaSeleccionada || 'Selecciona una cuenta' }}</span>
            </div>
            <div class="account-right">
              <span class="account-amount" *ngIf="cuentaAmount !== null">S/. {{ cuentaAmount | number:'1.2-2' }}</span>
              <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>
            </div>
          </div>
        </button>
      </div>

      <!-- Monto -->
      <div class="transfer-section">
        <label class="transfer-label">
          <ion-icon src="assets/icon/money.svg" class="label-icon"></ion-icon>
          Monto
        </label>
        <div class="amount-row">
          <app-amount-input
            class="amount-input-component"
            [(ngModel)]="monto"
            name="monto"
            placeholder="0.00"
            [required]="true"
            currencyCode="PEN"
            variant="enhanced"
            locale="es-PE"
            [maxDigits]="11"
            (ngModelChange)="onMontoChange()"
          ></app-amount-input>
        </div>
      </div>

      <!-- Tipo (Gastos/Ingresos) -->
      <div class="transfer-section">
        <label class="transfer-label">
          <ion-icon src="assets/icon/exchange.svg" class="label-icon"></ion-icon>
          Tipo
        </label>
        <div class="tipo-selectores">
          <button
            type="button"
            class="tipo-btn"
            [class.selected]="segmentoSeleccionado === 'gastos'"
            (click)="cambiarTipo('gastos')"
          >
            Gasto
          </button>
          <button
            type="button"
            class="tipo-btn"
            [class.selected]="segmentoSeleccionado === 'ingresos'"
            (click)="cambiarTipo('ingresos')"
          >
            Ingreso
          </button>
        </div>
      </div>

      <!-- Categorías -->
      <div class="transfer-section">
        <label class="transfer-label">
          <ion-icon src="assets/icon/grid.svg" class="label-icon"></ion-icon>
          Categorías
        </label>
        <div class="categories-grid">
          <div 
            *ngFor="let categoria of obtenerCategorias()" 
            class="category-item"
            [class.selected]="categoriaSeleccionada?.id === categoria.id"
            (click)="seleccionarCategoria(categoria)"
          >
            <div class="category-icon" [style.background-color]="categoria.color">
              <ion-icon [src]="'assets/icon/' + categoria.icono + '.svg'"></ion-icon>
            </div>
            <span class="category-name">{{ categoria.nombre }}</span>
          </div>
          
          <div class="category-item">
            <div class="category-icon-add">
              <ion-icon src="assets/icon/add.svg"></ion-icon>
            </div>
            <span class="category-name">Más</span>
          </div>
        </div>
      </div>

      <!-- Fecha -->
      <div class="transfer-section">
        <label class="transfer-label">
          <ion-icon name="calendar-outline" class="label-icon"></ion-icon>
          Fecha
        </label>
        <div class="date-options">
          <button 
            type="button"
            class="date-btn" 
            [class.active]="fechaSeleccionada === 'hoy'"
            (click)="setFechaHoy()"
          >
            20/11<br>hoy
          </button>
          <button 
            type="button"
            class="date-btn"
            [class.active]="fechaSeleccionada === 'ayer'"
            (click)="setFechaAyer()"
          >
            19/11<br>ayer
          </button>
          <button 
            type="button"
            class="date-btn"
            [class.active]="fechaSeleccionada === 'ultimo'"
            (click)="setFechaUltimo()"
          >
            23/6<br>último
          </button>
          <button 
            type="button"
            class="calendar-btn" 
            (click)="abrirCalendario()"
          >
              <ion-icon src="assets/icon/calendar.svg"></ion-icon>
          </button>
        </div>
      </div>

      <!-- Comentario -->
      <div class="transfer-section">
        <label class="transfer-label">
          <ion-icon name="create-outline" class="label-icon"></ion-icon>
          Comentario
        </label>
        <ion-textarea 
          [(ngModel)]="comentario"
          [ngModelOptions]="{standalone: true}"
          placeholder="Ingrese un comentario (opcional)"
          class="comment-input"
          rows="3"
          (ionInput)="onComentarioChange()"
        ></ion-textarea>
        <div class="comment-count">{{ comentario.length }}/200</div>
      </div>

      <!-- Botón -->
      <ion-button
        expand="block"
        class="btn-transferir"
        [disabled]="!puedeGuardar"
        type="button"
        (click)="crearTransaccion()"
      >
        Añadir
      </ion-button>
    </form>
  </div>

  <app-custom-alert
    *ngIf="showCustomAlert"
    header="Cambios sin guardar"
    message="Has realizado cambios en la transacción. ¿Deseas salir sin guardar?"
    cancelText="No"
    confirmText="Sí"
    (onCancel)="showCustomAlert = false"
    (onConfirm)="salirSinGuardar()"
  ></app-custom-alert>

  <!-- Modal de selección de cuentas -->
  <app-account-selector-modal
    [isOpen]="isModalOpen"
    [accounts]="cuentas"
    [selectedAccountId]="cuentaId"
    (accountSelected)="onAccountSelected($event)"
    (modalClosed)="closeModal()"
  ></app-account-selector-modal>

</ion-content>
