<ion-header><app-page-layout [title]="lesson ? 'Lección ' + lesson.number : 'Lección'" [loading]="(loadingService.loading$ | async) ?? false" (back)="back()"></app-page-layout></ion-header>
<ion-content class="lesson-page" [scrollY]="true"><main class="lesson-content">
  @if (errorMessage) {<app-empty-state icon="alert-triangle" title="No pudimos cargar la lección" [description]="errorMessage"></app-empty-state><app-button text="Reintentar" variant="primary" (clicked)="retry()"></app-button>}
  @else if (lesson) {
    <section class="lesson-intro"><div class="lesson-progress"><i [style.width.%]="progressPercentage"></i></div><span>{{lesson.number}} de {{lesson.total_lessons}}</span></section>
    <header class="lesson-heading"><h1>{{lesson.title}}</h1><div><span><app-item-icon icon="history" size="xxs" variant="plain" color="var(--fv-text-secondary)"></app-item-icon>{{lesson.minutes}} min</span><span><app-item-icon icon="school" size="xxs" variant="plain" color="var(--fv-primary)"></app-item-icon>{{lesson.level|titlecase}}</span></div></header>
    <section class="lesson-blocks">@for(section of contentSections;track section.id){<app-lesson-content-renderer [section]="section" [fallbackTitle]="lesson.title"></app-lesson-content-renderer>}</section>
  }
</main></ion-content>
@if(lesson){<footer class="lesson-footer"><nav class="lesson-navigation"><app-button text="Anterior" icon="left-inline" variant="ghost" size="compact" [disabled]="completingLesson||!lesson.previous_lesson" (clicked)="goToLesson(lesson.previous_lesson?.id)"></app-button><app-button [text]="lesson.next_lesson?'Siguiente lección':lesson.quiz.available?'Ir al reto final':'Curso finalizado'" icon="right-inline" iconPosition="end" variant="primary" size="compact" [disabled]="completingLesson||(!lesson.next_lesson&&!lesson.quiz.available)" (clicked)="goToNextLesson()"></app-button></nav></footer>}
