<ion-content
  [fullscreen]="false"
  class="accounts-page">

  <div class="accounts-content">

    <!-- ==========================================================
         SUMMARY (SIN COMPONENTE ICONO)
         ========================================================== -->

    <section class="accounts-summary">

      <span class="summary-label">
        Balance total
      </span>

      <h1 class="summary-amount">
        S/. {{ totalCuentas | number:'1.2-2' }}
      </h1>

      <div class="summary-footer">

        <div class="summary-chip">

          <ion-icon
            src="assets/icon/wallet.svg">
          </ion-icon>

          <span>
            {{ accountList.length }} cuentas
          </span>

        </div>

      </div>

    </section>

    <!-- ==========================================================
         QUICK ACTIONS (SIN COMPONENTE ICONO)
         ========================================================== -->

    <section class="actions-section">

      <button class="action-card" (click)="goToCreateAccount()">

        <div class="action-icon">

          <ion-icon src="assets/icon/add.svg"></ion-icon>

        </div>

        <span>Crear cuenta</span>

      </button>

      <button class="action-card" (click)="goToNewTransfer()">

        <div class="action-icon">

          <ion-icon src="assets/icon/transfer.svg"></ion-icon>

        </div>

        <span>Transferir</span>

      </button>

      <button class="action-card" (click)="goToHistoryTransfer()">

        <div class="action-icon">

          <ion-icon src="assets/icon/history.svg"></ion-icon>

        </div>

        <span>Historial</span>

      </button>

    </section>

    <!-- ==========================================================
         ACCOUNTS (AQUÍ SÍ SE USA COMPONENTE)
         ========================================================== -->

    <section
      class="accounts-section"
      *ngIf="accountList.length">

      <div class="section-header">

        <h2>Tus cuentas</h2>

        <div class="accounts-counter">
          {{ accountList.length }}
        </div>

      </div>

      <button
        *ngFor="let account of accountList"
        type="button"
        class="account-card"
        (click)="goToEditAccount(account)">

        <!-- LEFT -->

        <div class="account-left">

          <div
            class="account-icon"
            [style.background]="account.color">

            <app-item-icon
              [icon]="account.icon"
              size="sm"
              [color]="account.color">
            </app-item-icon>

          </div>

          <div class="account-info">

            <h3>{{ account.name }}</h3>

            <span class="account-subtitle">
              Cuenta financiera
            </span>

          </div>

        </div>

        <!-- RIGHT -->

        <div class="account-right">

          <div class="account-amount">
            S/. {{ +account.amount | number:'1.2-2' }}
          </div>

          <ion-icon
            class="transfer-arrow"
            src="assets/icon/right-inline.svg">
          </ion-icon>

        </div>

      </button>

    </section>

    <!-- ==========================================================
         EMPTY STATE (SIN COMPONENTE ICONO)
         ========================================================== -->

    <section class="empty-state" *ngIf="!accountList.length">

      <div class="empty-icon">

        <ion-icon src="assets/icon/wallet.svg"></ion-icon>

      </div>

      <h2>Aún no tienes cuentas</h2>

      <p>
        Crea tu primera cuenta para comenzar a administrar tu dinero en FinVia.
      </p>

      <app-button
        text="Crear cuenta"
        icon="add"
        (clicked)="goToCreateAccount()">
      </app-button>

    </section>

  </div>

</ion-content>
