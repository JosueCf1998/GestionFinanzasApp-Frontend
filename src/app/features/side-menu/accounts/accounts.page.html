<ion-content
  [fullscreen]="false"
  class="accounts-page">

  <div class="accounts-content">

    <!-- ==========================================================
         SUMMARY
         ========================================================== -->

    <section class="accounts-summary">

      <span class="summary-label">

        Balance total

      </span>

      <h1 class="summary-amount">

        S/. {{ totalCuentas | number:'1.2-2' }}

      </h1>

      <div class="summary-footer">

        <div class="summary-chip">

          <ion-icon
            src="assets/icon/wallet.svg">
          </ion-icon>

          <span>

            {{ accountList.length }} cuentas

          </span>

        </div>

      </div>

    </section>

    <!-- ==========================================================
         QUICK ACTIONS
         ========================================================== -->

    <section class="actions-section">

      <button
        type="button"
        class="action-card"
        (click)="goToCreateAccount()">

        <div class="action-icon">

          <ion-icon
            src="assets/icon/add.svg">
          </ion-icon>

        </div>

        <span>

          Crear cuenta

        </span>

      </button>

      <button
        type="button"
        class="action-card"
        (click)="goToNewTransfer()">

        <div class="action-icon">

          <ion-icon
            src="assets/icon/transfer.svg">
          </ion-icon>

        </div>

        <span>

          Transferir

        </span>

      </button>

      <button
        type="button"
        class="action-card"
        (click)="goToHistoryTransfer()">

        <div class="action-icon">

          <ion-icon
            src="assets/icon/history.svg">
          </ion-icon>

        </div>

        <span>

          Historial

        </span>

      </button>

    </section>

    <!-- ==========================================================
         ACCOUNTS
         ========================================================== -->

    <section
      class="accounts-section"
      *ngIf="accountList.length">

      <div class="section-header">

        <h2>

          Tus cuentas

        </h2>

        <div class="accounts-counter">

          {{ accountList.length }}

        </div>

      </div>

      <button
        *ngFor="let account of accountList"
        type="button"
        class="account-card"
        (click)="goToEditAccount(account)">

        <!-- ICON -->

        <div
          class="account-icon"
          [style.background]="account.color">

          <ion-icon
            [src]="'assets/icon/' + account.icon + '.svg'">
          </ion-icon>

        </div>

        <!-- INFO -->

        <div class="account-info">

          <h3>

            {{ account.name }}

          </h3>

          <span>

            Cuenta financiera

          </span>

        </div>

        <!-- BALANCE -->

        <div class="account-right">

          <div class="account-amount">

            S/. {{ +account.amount | number:'1.2-2' }}

          </div>

          <ion-icon
            class="account-arrow"
            src="assets/icon/right.svg">
          </ion-icon>

        </div>

      </button>

    </section>

    <!-- ==========================================================
         EMPTY
         ========================================================== -->

    <section
      class="empty-state"
      *ngIf="!accountList.length">

      <div class="empty-icon">

        <ion-icon
          src="assets/icon/wallet.svg">
        </ion-icon>

      </div>

      <h2>

        Aún no tienes cuentas

      </h2>

      <p>

        Crea tu primera cuenta para comenzar a administrar tu dinero en FinVia.

      </p>

      <app-button
        text="Crear cuenta"
        icon="add"
        (clicked)="goToCreateAccount()">

      </app-button>

    </section>

  </div>

</ion-content>
