<ion-content [fullscreen]="true">
  <div class="content">
    <div class="scrollable-content">
      <!-- Total -->
      <div class="accounts-total-card">
        <span class="total-label">Total cuentas</span>
        <span class="currency">S/. {{ totalCuentas | number:'1.2-2' }}</span>
      </div>

      <!-- Acciones -->
      <div class="accounts-actions">
        <div class="action-btn" (click)="goToCreateAccount()">
          <div class="action-icon">
            <ion-icon src="assets/icon/add.svg"></ion-icon>
          </div>
          <span class="text-small">Crear Cuenta</span>
        </div>
        <div class="action-btn" (click)="goToHistoryTransfer()">
          <div class="action-icon">
            <ion-icon src="assets/icon/history.svg"></ion-icon>
          </div>
          <span class="text-small">Historial de transferencias</span>
        </div>
        <div class="action-btn" (click)="goToNewTransfer()">
          <div class="action-icon">
            <ion-icon src="assets/icon/transfer.svg"></ion-icon>
          </div>
          <span class="text-small">Nueva transferencia</span>
        </div>
      </div>

      <!-- Lista de cuentas -->
      <div class="accounts-list" *ngIf="accountList.length > 0">
        <div *ngFor="let account of accountList">
          <div class="account-item" (click)="goToEditAccount(account)">
            <div class="account-icon" [ngStyle]="{'background': account.color}">
              <ion-icon src="assets/icon/{{account.icon}}.svg"></ion-icon>
            </div>
            <div class="account-info">
              <span class="text-body text-primary">{{ account.name }}</span>
            </div>
            <div class="account-balance text-body-bold text-primary">
              S/. {{ +account.amount | number:'1.2-2' }} 
            </div>
          </div>
        </div>
      </div>

      <!-- Mensaje cuando no hay cuentas -->
      <div class="empty-state" *ngIf="accountList.length === 0">
        <ion-icon src="assets/icon/wallet.svg" class="empty-icon"></ion-icon>
        <h3 class="text-subtitle text-primary">No tienes cuentas registradas</h3>
        <p class="text-caption text-secondary">Crea tu primera cuenta para comenzar a gestionar tus finanzas</p>
        <button class="create-account-btn text-button text-white" (click)="goToCreateAccount()">
          <ion-icon src="assets/icon/add.svg"></ion-icon>
          Crear cuenta
        </button>
      </div>
    </div>
  </div>

</ion-content>
