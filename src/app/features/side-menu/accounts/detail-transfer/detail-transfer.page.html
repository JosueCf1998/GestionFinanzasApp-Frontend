<!-- ==========================================================
     HEADER
     ========================================================== -->

<ion-header>
  <app-page-layout
    [title]="title"
    [showBack]="true"
    (back)="backToCategories()">
  </app-page-layout>
</ion-header>

<!-- ==========================================================
     CONTENT
     ========================================================== -->

<ion-content [fullscreen]="true">

  <div class="transfer-detail-page">

    <!-- ==========================================================
         MAIN CARD
         ========================================================== -->

    <div class="detail-card">

      <!-- ======================================================
           ACCOUNTS SECTION
           ====================================================== -->

      <div class="section">

        <!-- ORIGIN -->
        <div
          class="row"
          *ngIf="type === 'Realizado' || type === 'Ajuste'">

          <span class="label">
            {{ type === 'Realizado' ? 'Desde' : 'Cuenta' }}
          </span>

          <div class="account-row">

            <app-item-icon
              [icon]="cuentaOrigenIcon"
              [color]="cuentaOrigenColor"
              size="lg">
            </app-item-icon>

            <span class="value">
              {{ cuentaOrigen }}
            </span>

          </div>

        </div>

        <!-- DESTINATION -->
        <div
          class="row"
          *ngIf="type === 'Realizado' || type === 'Inicial'">

          <span class="label">
            {{ type === 'Realizado' ? 'Hacia' : 'Cuenta inicial' }}
          </span>

          <div class="account-row">

            <app-item-icon
              [icon]="cuentaDestinoIcon"
              [color]="cuentaDestinoColor"
              size="lg">
            </app-item-icon>

            <span class="value">
              {{ cuentaDestino }}
            </span>

          </div>

        </div>

      </div>

      <!-- DIVIDER -->
      <div class="divider"></div>

      <!-- ======================================================
           DETAILS SECTION
           ====================================================== -->

      <div class="section">

        <!-- AMOUNT -->
        <div class="row">

          <span class="label">
            Monto
          </span>

          <span class="value strong">
            S/. {{ monto | number:'1.2-2' }}
          </span>

        </div>

        <!-- DATE -->
        <div class="row">

          <span class="label">
            Fecha
          </span>

          <span class="value">
            {{ formatDate(fecha) }}
          </span>

        </div>

        <!-- COMMENT -->
        <div
          class="row"
          *ngIf="comentario">

          <span class="label">
            Comentario
          </span>

          <span class="value muted">
            {{ comentario }}
          </span>

        </div>

      </div>

    </div>

    <!-- ==========================================================
         ACTIONS
         ========================================================== -->

    <div
      class="actions"
      *ngIf="type === 'Realizado'">

      <ion-button
        class="btn-primary"
        expand="block"
        (click)="editarTransferencia()">

        <ion-icon src="assets/icon/edit.svg"></ion-icon>

        Editar

      </ion-button>

      <ion-button
        class="btn-danger"
        expand="block"
        (click)="eliminarTransferencia()">

        Eliminar

      </ion-button>

    </div>

  </div>

</ion-content>

<!-- ==========================================================
     ALERTS
     ========================================================== -->

<app-custom-alert
  *ngIf="showCustomAlert"
  header="Eliminar transferencia"
  message="¿Estás seguro de que deseas eliminar esta transferencia?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="cerrarAlert()"
  (onConfirm)="confirmarEliminacion()">
</app-custom-alert>

<app-custom-alert
  *ngIf="showErrorAlert"
  header="Error"
  [message]="messageError"
  confirmText="OK"
  (onConfirm)="cerrarAlert()">
</app-custom-alert>

  <app-custom-alert
  *ngIf="showGenericAlert"
  header=""
  [message]="'No se pudo completar la acción. Por favor, intenta nuevamente.'"
  [imageUrl]="'assets/icon/alert-triangle.svg'"
  [confirmText]="'Entendido'"
  [alertSize]="'medium'"
  [reverseButtons]="true"
  [showCancel]="false"
  (onConfirm)="showGenericAlert = false">
  </app-custom-alert>

<app-custom-alert
  *ngIf="showUnauthorizedAlert"
  header=""
  [message]="messageError"
  [imageUrl]="'assets/icon/alert-triangle.svg'"
  [confirmText]="'Entendido'"
  [alertSize]="'medium'"
  [reverseButtons]="true"
  [showCancel]="false"
  (onConfirm)="showUnauthorizedAlert = false">
</app-custom-alert>
