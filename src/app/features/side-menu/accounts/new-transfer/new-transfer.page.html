<!-- Content General -->
<ion-content [fullscreen]="true" scroll-y="false">
  <!-- Content Header -->
  <ion-header>
    <ion-toolbar class="side-menu" color="side-menu">
      <ion-buttons slot="start">
        <button class="atras-btn" type="button" (click)="backToCategories()">
          <ion-icon src="assets/icon/left.svg"></ion-icon>
        </button>
      </ion-buttons>
      <ion-title class="header-title">Crear Transferencia</ion-title>
      <ion-buttons slot="end">
        <!-- Acciones adicionales -->
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- Content Body -->
  <form class="transfer-form" (ngSubmit)="crearTransferencia()">
    <div class="transfer-section">
      <label class="transfer-label">Transfiere de una cuenta</label>
      <button
        type="button"
        class="account-btn"
        (click)="seleccionarCuentaOrigen()"
      >
        <span [class.selected]="cuentaOrigen"
          >{{ cuentaOrigen || 'Selecciona una cuenta' }}</span
        >
      </button>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Transfiere a una cuenta</label>
      <button
        type="button"
        class="account-btn"
        (click)="seleccionarCuentaDestino()"
      >
        <span [class.selected]="cuentaDestino"
          >{{ cuentaDestino || 'No se ha seleccionado' }}</span
        >
      </button>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Transfiere una cantidad</label>
      <div class="amount-row">
        <ion-input
          type="number"
          min="0"
          [(ngModel)]="monto"
          name="monto"
          class="amount-input"
          placeholder="0"
          (ionChange)="onInputChange()"
          required
        >
        </ion-input>
        <span class="currency-label">PEN</span>
      </div>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Fecha</label>
      <ion-datetime-button datetime="fecha-transferencia"></ion-datetime-button>
      
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime 
            id="fecha-transferencia"
            presentation="date"
            [(ngModel)]="fecha"
            name="fecha"
            [max]="maxDate"
            (ionChange)="onInputChange()"
          ></ion-datetime>
        </ng-template>
      </ion-modal>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Comentario</label>
      <ion-textarea
        [(ngModel)]="comentario"
        name="comentario"
        maxlength="4096"
        placeholder="Comentario"
        class="comment-input"
        (ionChange)="onInputChange()"
      >
      </ion-textarea>
      <div class="comment-count">{{ comentario.length || 0 }}/4096</div>
    </div>

    <ion-button
      expand="block"
      class="btn-transferir"
      [disabled]="!cuentaOrigen || !cuentaDestino || !monto"
      type="submit"
    >
      Guardar
    </ion-button>
  </form>


  <!-- Modal -->

  <app-custom-alert
    *ngIf="showCustomAlert"
    header="Cambios sin guardar"
    message="Has realizado cambios en la transferencia. ¿Deseas salir sin guardar?"
    cancelText="No"
    confirmText="Sí"
    (onCancel)="showCustomAlert = false"
    (onConfirm)="salirSinGuardar()"
  ></app-custom-alert>

  <ion-modal 
    [isOpen]="isModalOpen" 
    (didDismiss)="closeModal()" 
    [cssClass]="getModalClass()"
  >
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>
            {{ tipoSeleccion === 'origen' ? 'Seleccionar Cuenta Origen' : 'Seleccionar Cuenta Destino' }}
          </ion-title>
          <ion-buttons slot="end">
            <ion-button fill="clear" (click)="closeModal()">
              <ion-icon name="close-outline"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content scroll-y="false">
        <div class="modal-content">
          <div class="cuentas-list" [class.scrollable]="cuentasDisponibles.length > 3">
            <button
              *ngFor="let cuenta of cuentasDisponibles"
              type="button"
              class="cuenta-item"
              [class.selected]="cuentaSeleccionada?.id === cuenta.id"
              (click)="seleccionarCuentaModal(cuenta)">
              {{ cuenta.nombre }}
              <span *ngIf="cuenta.saldo !== undefined" class="saldo-info">
                (S/ {{ cuenta.saldo }})
              </span>
            </button>
          </div>
          <ion-button 
            expand="block" 
            shape="round" 
            color="primary" 
            [disabled]="!cuentaSeleccionada"
            (click)="confirmarCuenta()">
            Confirmar
          </ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
