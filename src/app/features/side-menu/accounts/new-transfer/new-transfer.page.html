<!-- HEADER -->
<ion-header>
  <app-page-layout
    [title]="title"
    [showBack]="true"
    (back)="backToCategories()">
  </app-page-layout>
</ion-header>

<!-- CONTENT -->
<ion-content [fullscreen]="true" scroll-y="false">

  <form class="transfer-form" (ngSubmit)="crearTransferencia()">

    <!-- ORIGEN -->
    <div class="transfer-section">

      <label class="transfer-label">
        Transfiere desde
      </label>

      <button
        type="button"
        class="account-btn"
        (click)="seleccionarCuentaOrigen()">

        <div class="account-btn-content">

          <span class="account-name">
            {{ cuentaOrigen || 'Selecciona una cuenta' }}
          </span>

          <span class="account-amount" *ngIf="cuentaOrigenAmount !== null">
            S/. {{ cuentaOrigenAmount | number:'1.2-2' }}
          </span>

        </div>

      </button>

    </div>

    <!-- DESTINO -->
    <div class="transfer-section">

      <label class="transfer-label">
        Transfiere hacia
      </label>

      <button
        type="button"
        class="account-btn"
        (click)="seleccionarCuentaDestino()">

        <div class="account-btn-content">

          <span class="account-name">
            {{ cuentaDestino || 'Selecciona una cuenta' }}
          </span>

          <span class="account-amount" *ngIf="cuentaDestinoAmount !== null">
            S/. {{ cuentaDestinoAmount | number:'1.2-2' }}
          </span>

        </div>

      </button>

    </div>

    <!-- MONTO -->
    <div class="transfer-section">

      <label class="transfer-label">
        Monto
      </label>

      <div class="amount-row">
        <app-amount-input
          [(ngModel)]="monto"
          name="monto"
          placeholder="0.00"
          [required]="true"
          currencyCode="PEN"
          variant="enhanced"
          locale="es-PE"
          [maxDigits]="11"
          (ngModelChange)="onInputChange()">
        </app-amount-input>
      </div>

    </div>

    <!-- FECHA -->
    <div class="transfer-section">

      <label class="transfer-label">
        Fecha
      </label>

      <ion-datetime-button datetime="fecha-transferencia"></ion-datetime-button>

      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime
            id="fecha-transferencia"
            presentation="date"
            [(ngModel)]="fecha"
            name="fecha"
            [max]="maxDate"
            (ionChange)="onInputChange()">
          </ion-datetime>
        </ng-template>
      </ion-modal>

    </div>

    <!-- COMENTARIO -->
    <div class="transfer-section">

      <label class="transfer-label">
        Comentario
      </label>

      <ion-textarea
        [(ngModel)]="comentario"
        name="comentario"
        maxlength="4096"
        placeholder="Agrega un comentario (opcional)"
        class="comment-input"
        (ionChange)="onInputChange()">
      </ion-textarea>

      <div class="comment-count">
        {{ comentario?.length || 0 }}/4096
      </div>

    </div>

    <!-- BOTÓN -->
    <ion-button
      expand="block"
      class="btn-transferir"
      type="submit"
      [disabled]="!canSubmit">

      Guardar transferencia

    </ion-button>

  </form>

</ion-content>

<!-- ALERT -->
<app-custom-alert
  *ngIf="showCustomAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en la transferencia. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showCustomAlert = false"
  (onConfirm)="salirSinGuardar()">
</app-custom-alert>

<!-- MODAL (SINGLE MODE CORRECTO) -->
<app-account-selector-modal
  [isOpen]="isModalOpen"
  [accounts]="accounts"
  [selectionMode]="AccountSelectionMode.SINGLE"
  [selectedAccount]="selectedAccount"
  (modalClosed)="closeModal()"
  (accountSelected)="seleccionarYConfirmar($event)">
</app-account-selector-modal>
