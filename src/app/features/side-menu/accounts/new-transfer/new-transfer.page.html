<!-- Content General -->
<ion-content [fullscreen]="true" scroll-y="false">
  <!-- Content Header -->
  <ion-header>
    <ion-toolbar class="side-menu" color="side-menu">
      <ion-buttons slot="start">
        <button class="atras-btn" type="button" (click)="backToCategories()">
          <ion-icon src="assets/icon/left.svg"></ion-icon>
        </button>
      </ion-buttons>
      <ion-title class="header-title">Crear Transferencia</ion-title>
      <ion-buttons slot="end">
        <!-- Acciones adicionales -->
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- Content Body -->
  <form class="transfer-form" (ngSubmit)="crearTransferencia()">
    <div class="transfer-section">
      <label class="transfer-label">Transfiere de una cuenta</label>
      <button
        type="button"
        class="account-btn"
        (click)="seleccionarCuentaOrigen()"
      >
        <span [class.selected]="cuentaOrigen"
          >{{ cuentaOrigen || 'Selecciona una cuenta' }}</span
        >
      </button>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Transfiere a una cuenta</label>
      <button
        type="button"
        class="account-btn"
        (click)="seleccionarCuentaDestino()"
      >
        <span [class.selected]="cuentaDestino"
          >{{ cuentaDestino || 'Selecciona una cuenta' }}</span
        >
      </button>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Transfiere una cantidad</label>
      <div class="amount-row">
        <ion-input
          type="number"
          min="0"
          [(ngModel)]="monto"
          name="monto"
          class="amount-input"
          placeholder="0"
          (ionChange)="onInputChange()"
          required
        >
        </ion-input>
        <span class="currency-label">PEN</span>
      </div>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Fecha</label>
      <ion-datetime-button datetime="fecha-transferencia"></ion-datetime-button>
      
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime 
            id="fecha-transferencia"
            presentation="date"
            [(ngModel)]="fecha"
            name="fecha"
            [max]="maxDate"
            (ionChange)="onInputChange()"
          ></ion-datetime>
        </ng-template>
      </ion-modal>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Comentario</label>
      <ion-textarea
        [(ngModel)]="comentario"
        name="comentario"
        maxlength="4096"
        placeholder="Agrega un comentario (opcional)"
        class="comment-input"
        (ionChange)="onInputChange()"
      >
      </ion-textarea>
      <div class="comment-count">{{ comentario.length || 0 }}/4096</div>
    </div>

    <ion-button
      expand="block"
      class="btn-transferir"
      [disabled]="!cuentaOrigen || !cuentaDestino || !monto"
      type="submit"
    >
      Guardar
    </ion-button>
  </form>


  <!-- Modal -->

  <app-custom-alert
    *ngIf="showCustomAlert"
    header="Cambios sin guardar"
    message="Has realizado cambios en la transferencia. ¿Deseas salir sin guardar?"
    cancelText="No"
    confirmText="Sí"
    (onCancel)="showCustomAlert = false"
    (onConfirm)="salirSinGuardar()"
  ></app-custom-alert>

  <ion-modal 
    [isOpen]="isModalOpen" 
    (didDismiss)="closeModal()" 
    [cssClass]="getModalClass()"
  >
    <ng-template>
      <div class="modal-wrapper">
        <div class="modal-header">
          <h2 class="modal-title">Seleccione una cuenta</h2>
          <button class="btn-close" (click)="closeModal()">
              <ion-icon [src]="'assets/icon/cross.svg'"></ion-icon>
          </button>
        </div>
        
        <div class="modal-body">
          <div class="cuentas-list" [class.scrollable]="cuentasDisponibles.length > 3">
            <div
              *ngFor="let account of cuentasDisponibles"
              class="cuenta-card"
              [class.selected]="selectedAccount?.id === account.id"
              (click)="seleccionarYConfirmar(account)">
              <div class="cuenta-left">
                <div class="cuenta-icon" [style.background]="account.color">
                  <ion-icon [src]="'assets/icon/' + account.icon + '.svg'"></ion-icon>
                </div>
                <div class="cuenta-details">
                  <span class="cuenta-nombre">{{ account.name }}</span>
                  <span class="cuenta-saldo">S/. {{ +account.amount | number:'1.2-2' }}</span>
                </div>
              </div>
              <div class="cuenta-check">
                <ion-icon name="checkmark-circle" *ngIf="selectedAccount?.id === account.id"></ion-icon>
                <div class="check-placeholder" *ngIf="selectedAccount?.id !== account.id"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </ion-modal>

</ion-content>
