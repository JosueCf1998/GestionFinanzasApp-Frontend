<!-- Content General -->
<ion-content [fullscreen]="true" scroll-y="false">
  <!-- Content Header -->
  <ion-header>
    <ion-toolbar class="side-menu" color="side-menu">
      <ion-buttons slot="start">
        <button class="atras-btn" type="button" (click)="backToCategories()">
          <ion-icon src="assets/icon/left.svg"></ion-icon>
        </button>
      </ion-buttons>
      <ion-title class="header-title">{{ title }}</ion-title>
      <ion-buttons slot="end">
        <!-- Acciones adicionales -->
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <!-- Content Body -->
  <form class="transfer-form" (ngSubmit)="crearTransferencia()">
    <div class="transfer-section">
      <label class="transfer-label">Transfiere de una cuenta</label>
      <button
        type="button"
        class="account-btn"
        (click)="seleccionarCuentaOrigen()"
      >
        <div class="account-btn-content" [class.selected]="cuentaOrigen">
          <span class="account-name">{{ cuentaOrigen || 'Selecciona una cuenta' }}</span>
          <span class="account-amount" *ngIf="cuentaOrigenAmount !== null">S/. {{ cuentaOrigenAmount | number:'1.2-2' }}</span>
        </div>
      </button>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Transfiere a una cuenta</label>
      <button
        type="button"
        class="account-btn"
        (click)="seleccionarCuentaDestino()"
      >
        <div class="account-btn-content" [class.selected]="cuentaDestino">
          <span class="account-name">{{ cuentaDestino || 'Selecciona una cuenta' }}</span>
          <span class="account-amount" *ngIf="cuentaDestinoAmount !== null">S/. {{ cuentaDestinoAmount | number:'1.2-2' }}</span>
        </div>
      </button>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Transfiere una cantidad</label>
      <div class="amount-row">
        <ion-input
          type="number"
          min="0"
          [(ngModel)]="monto"
          name="monto"
          class="amount-input"
          placeholder="0"
          (ionChange)="onInputChange()"
          required
        >
        </ion-input>
        <span class="currency-label">PEN</span>
      </div>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Fecha</label>
      <ion-datetime-button datetime="fecha-transferencia"></ion-datetime-button>
      
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime 
            id="fecha-transferencia"
            presentation="date"
            [(ngModel)]="fecha"
            name="fecha"
            [max]="maxDate"
            (ionChange)="onInputChange()"
          ></ion-datetime>
        </ng-template>
      </ion-modal>
    </div>

    <div class="transfer-section">
      <label class="transfer-label">Comentario</label>
      <ion-textarea
        [(ngModel)]="comentario"
        name="comentario"
        maxlength="4096"
        placeholder="Agrega un comentario (opcional)"
        class="comment-input"
        (ionChange)="onInputChange()"
      >
      </ion-textarea>
      <div class="comment-count">{{ comentario.length || 0 }}/4096</div>
    </div>

    <ion-button
      expand="block"
      class="btn-transferir"
      [disabled]="!cuentaOrigen || !cuentaDestino || !monto"
      type="submit"
    >
      Guardar
    </ion-button>
  </form>


  <!-- Modal -->

  <app-custom-alert
    *ngIf="showCustomAlert"
    header="Cambios sin guardar"
    message="Has realizado cambios en la transferencia. ¿Deseas salir sin guardar?"
    cancelText="No"
    confirmText="Sí"
    (onCancel)="showCustomAlert = false"
    (onConfirm)="salirSinGuardar()"
  ></app-custom-alert>

  <app-account-selector-modal
    [isOpen]="isModalOpen"
    [accounts]="cuentasDisponibles"
    [selectedAccountId]="selectedAccount?.id?.toString() || null"
    (accountSelected)="seleccionarYConfirmar($event)"
    (modalClosed)="closeModal()"
  ></app-account-selector-modal>

</ion-content>
