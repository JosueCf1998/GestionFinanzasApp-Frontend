<!-- ==========================================================
     HEADER
     ========================================================== -->

<ion-header>

  <app-page-layout
    [title]="title"
    [showBack]="true"
    (back)="backToAccounts()">

  </app-page-layout>

</ion-header>

<!-- ==========================================================
     CONTENT
     ========================================================== -->

<ion-content
  [fullscreen]="false"
  class="create-account-page">

  <form
    class="create-account-form"
    (ngSubmit)="guardarCuenta()">

    <!-- ==========================================================
         ACCOUNT PREVIEW
         ========================================================== -->

    <section class="account-preview">

      <div
        class="preview-icon"
        [style.background]="colorSeleccionado">

        <ion-icon
          [src]="'assets/icon/' + iconoSeleccionado + '.svg'">
        </ion-icon>

      </div>

      <h2 class="preview-title">

        {{ nombreCuenta || 'Nueva cuenta' }}

      </h2>

      <div class="preview-balance">

        S/. {{ montoInicial || '0.00' }}

      </div>

    </section>

    <!-- ==========================================================
         INITIAL BALANCE
         ========================================================== -->

    <section class="form-section">

      <div class="section-header">

        <h3 class="section-label">

          Monto inicial

        </h3>

      </div>

      <app-amount-input
        class="fv-input"
        [(ngModel)]="montoInicial"
        name="montoInicial"
        placeholder="0.00"
        currencyCode="PEN"
        variant="enhanced"
        [required]="true">

      </app-amount-input>

    </section>

    <!-- ==========================================================
         ACCOUNT NAME
         ========================================================== -->

    <section class="form-section">

      <div class="section-header">

        <h3 class="section-label">

          Nombre de la cuenta

        </h3>

      </div>

      <ion-input
        class="fv-input"
        type="text"
        name="nombreCuenta"
        placeholder="Ej. Cuenta principal"
        maxlength="30"
        autocomplete="off"
        [(ngModel)]="nombreCuenta"
        required>

      </ion-input>

    </section>

    <!-- ==========================================================
         ICON
         ========================================================== -->

    <section class="form-section">

      <div class="section-header">

        <h3 class="section-label">

          Icono

        </h3>

      </div>

      <div class="icons-grid">

        <button
          *ngFor="let icon of iconos"
          type="button"
          class="icon-button"
          [class.selected]="icon.archivo === iconoSeleccionado"
          (click)="seleccionarIcono(icon)">

          <ion-icon
            [src]="'assets/icon/' + icon.archivo + '.svg'">
          </ion-icon>

        </button>

      </div>

    </section>

    <!-- ==========================================================
         COLOR
         ========================================================== -->

    <section class="form-section">

      <div class="section-header">

        <h3 class="section-label">

          Color

        </h3>

      </div>

      <div class="colors-grid">

        <button
          *ngFor="let color of colores"
          type="button"
          class="color-button"
          [style.background]="color.valor"
          [class.selected]="color.valor === colorSeleccionado"
          (click)="seleccionarColor(color)">

          <ion-icon
            *ngIf="color.valor === colorSeleccionado"
            src="assets/icon/check.svg">

          </ion-icon>

        </button>

      </div>

    </section>

    <!-- ==========================================================
         ACTIONS
         ========================================================== -->

    <div class="action-container">

      <app-button
        text="Guardar cuenta"
        type="submit"
        [disabled]="isValidateForm()">

      </app-button>

      <app-button
        *ngIf="!isCreateAccountActive"
        text="Eliminar cuenta"
        icon="trash"
        variant="danger"
        (clicked)="deleteAccount()">
      </app-button>

    </div>

  </form>

</ion-content>

<!-- ==========================================================
     ALERT
     ========================================================== -->

<app-custom-alert
  *ngIf="showCustomAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en la cuenta. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showCustomAlert = false"
  (onConfirm)="salirSinGuardar()">
</app-custom-alert>

<app-custom-alert
  *ngIf="showDeleteAlert"
  header="Eliminar cuenta"
  message="¿Estás seguro de que deseas eliminar esta cuenta?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="cerrarAlert()"
  (onConfirm)="confirmarEliminacion()">
</app-custom-alert>
