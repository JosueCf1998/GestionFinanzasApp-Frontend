<ion-header>
  <app-page-layout
    [title]="title"
    [showBack]="true"
    (back)="backToAccounts()">
  </app-page-layout>
</ion-header>

<ion-content [fullscreen]="false" class="create-account-page">
  <form class="create-account-form" (ngSubmit)="guardarCuenta()">
    <section class="account-preview" aria-label="Vista previa de la cuenta">
      <app-item-icon
        [icon]="iconoSeleccionado"
        [color]="colorSeleccionado"
        size="lg"
        variant="soft">
      </app-item-icon>

      <div class="account-preview__content">
        <span>Vista previa</span>
        <h2>{{ nombreCuenta.trim() || 'Nueva cuenta' }}</h2>
        <p>
          <small>Saldo inicial</small>
          <strong>{{ formattedBalance }}</strong>
        </p>
      </div>
    </section>

    <app-section-card title="Nombre de la cuenta">
      <app-text-field
        name="nombreCuenta"
        placeholder="Ej. Cuenta principal"
        ariaLabel="Nombre de la cuenta"
        [embedded]="true"
        [maxLength]="30"
        [required]="true"
        [(ngModel)]="nombreCuenta">
      </app-text-field>
    </app-section-card>

    <app-section-card title="Monto inicial">
      <app-amount-input
        [(ngModel)]="montoInicial"
        name="montoInicial"
        placeholder="0.00"
        currencyCode="PEN"
        variant="enhanced"
        [embedded]="true"
        [required]="true">
      </app-amount-input>
    </app-section-card>

    <app-section-card title="Apariencia" appearance="plain">
      <button
        type="button"
        class="personalization-row"
        (click)="openPersonalizationModal()">
        <app-item-icon
          [icon]="iconoSeleccionado"
          [color]="colorSeleccionado"
          size="md"
          variant="soft">
        </app-item-icon>

        <span>
          <strong>Icono y color</strong>
          <small>Personaliza cómo identificarás esta cuenta</small>
        </span>

        <ion-icon src="assets/icon/right-inline.svg"></ion-icon>
      </button>
    </app-section-card>

    <app-info-banner
      title="Consejo FinVia"
      message="Usa un nombre y una apariencia que te permitan reconocer rápidamente cada cuenta."
      symbol="✨">
    </app-info-banner>

    <div class="action-container">
      <app-button
        [text]="isCreateAccountActive ? 'Crear cuenta' : 'Guardar cambios'"
        type="submit"
        [disabled]="isValidateForm()">
      </app-button>

      <app-button
        *ngIf="!isCreateAccountActive"
        text="Eliminar cuenta"
        icon="trash"
        variant="danger"
        (clicked)="deleteAccount()">
      </app-button>
    </div>
  </form>
</ion-content>

<app-personalization-modal
  [isOpen]="isPersonalizationModalOpen"
  [selectedIcon]="iconoSeleccionado"
  [selectedColor]="colorSeleccionado"
  [icons]="iconos"
  [colors]="colores"
  title="Personalizar cuenta"
  description="Elige el icono y color que identificarán esta cuenta."
  previewText="Así se identificará tu cuenta"
  (modalClosed)="closePersonalizationModal()"
  (applied)="applyPersonalization($event)">
</app-personalization-modal>

<app-custom-alert
  *ngIf="showCustomAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en la cuenta. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showCustomAlert = false"
  (onConfirm)="salirSinGuardar()">
</app-custom-alert>

<app-custom-alert
  *ngIf="showDeleteAlert"
  header="Eliminar cuenta"
  message="¿Estás seguro de que deseas eliminar esta cuenta?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="cerrarAlert()"
  (onConfirm)="confirmarEliminacion()">
</app-custom-alert>

<app-custom-alert
  *ngIf="showGenericAlert"
  header="No se pudo guardar"
  message="Ocurrió un error al procesar la cuenta. Inténtalo nuevamente."
  confirmText="Aceptar"
  (onConfirm)="showGenericAlert = false">
</app-custom-alert>
