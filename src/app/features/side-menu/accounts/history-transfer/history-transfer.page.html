<!-- ==========================================================
     HEADER
     ========================================================== -->

<ion-header>
  <app-page-layout
    [title]="title"
    [showBack]="true"
    (back)="backToAccounts()">
  </app-page-layout>
</ion-header>

<!-- ==========================================================
     CONTENT
     ========================================================== -->

<ion-content
  [fullscreen]="true"
  scroll-y="false"
  class="transfer-history-page">

  <div class="content-wrapper">

    <!-- ==========================================================
         FILTERS
         ========================================================== -->

    <section class="filter-section">

      <!-- ACCOUNT FILTER -->
      <button
        type="button"
        class="account-filter"
        [class.active]="selectedAccounts.length !== accounts.length"
        (click)="openAccountModal()">

        <div class="filter-content">

          <app-item-icon
            *ngIf="selectedAccounts.length !== 1"
            icon="wallet"
            color="var(--fv-primary)">
          </app-item-icon>

          <app-item-icon
            *ngIf="selectedAccounts.length === 1"
            [icon]="selectedAccountIcon"
            [color]="selectedAccountColor">
          </app-item-icon>

          <div class="filter-text">

            <span class="filter-title">
              {{ accountFilterLabel }}
            </span>

            <span class="filter-subtitle">
              Filtrar transferencias
            </span>

          </div>

        </div>

        <ion-icon
          class="filter-arrow"
          src="assets/icon/transfer.svg">
        </ion-icon>

      </button>

      <!-- PERIOD SEGMENT -->
      <div class="period-card">

        <app-custom-segment
          [options]="periodTabs"
          [(model)]="selectedPeriod"
          segmentClass="period-tabs"
          (modelChange)="onPeriodChange()">
        </app-custom-segment>

      </div>

      <!-- PERIOD NAVIGATION -->
      <div class="period-navigation">

        <button
          type="button"
          class="nav-btn"
          (click)="prevPeriod()">

          <ion-icon src="assets/icon/left-inline.svg"></ion-icon>

        </button>

        <div class="period-label">

          <span *ngIf="selectedPeriod === 'semana'">
            Semana {{ selectedWeekOfMonth }} · {{ getMonthName(selectedMonth) }} {{ selectedYear }}
          </span>

          <span *ngIf="selectedPeriod === 'mes'">
            {{ getMonthName(selectedMonth) }} {{ selectedYear }}
          </span>

          <span *ngIf="selectedPeriod === 'anio'">
            {{ selectedYear }}
          </span>

        </div>

        <button
          type="button"
          class="nav-btn"
          (click)="nextPeriod()">

          <ion-icon src="assets/icon/right-inline.svg"></ion-icon>

        </button>

      </div>

    </section>

    <!-- ==========================================================
         TRANSFERS LIST
         ========================================================== -->

    <section class="transfers-list">

      <!-- EMPTY STATE -->
      <div
        *ngIf="groupedTransfers.length === 0"
        class="empty-state">

        <div class="empty-icon">
          <ion-icon src="assets/icon/transfer.svg"></ion-icon>
        </div>

        <h3 class="empty-title">
          Sin transferencias
        </h3>

        <p class="empty-description">
          Aquí verás tus movimientos entre cuentas cuando realices transferencias.
        </p>

      </div>

      <!-- GROUPS -->
      <div
        *ngFor="let group of groupedTransfers"
        class="transfer-group">

        <!-- DATE HEADER -->
        <div class="date-header">
          <span class="date-text">
            {{ group.fecha }}
          </span>
        </div>

        <!-- ITEMS -->
        <button
          *ngFor="let transfer of group.items"
          type="button"
          class="transfer-item"
          (click)="editTransfer(transfer)">

          <!-- LEFT -->
          <div class="transfer-main">

            <app-item-icon
              [icon]="getTransferIcon(transfer.type)"
              size="sm"
              [color]="getTransferColor(transfer.type)">
            </app-item-icon>

            <div class="transfer-info">

              <ng-container *ngIf="transfer.type === 'Inicial'">

                <div class="transfer-title">
                  {{ transfer.destinationAccountName }}
                </div>

                <div class="transfer-comment">
                  Saldo inicial
                </div>

              </ng-container>

              <ng-container *ngIf="transfer.type === 'Ajuste'">

                <div class="transfer-title">
                  {{ transfer.originAccountName }}
                </div>

                <div class="transfer-comment">
                  Ajuste de saldo
                </div>

              </ng-container>

              <ng-container *ngIf="transfer.type === 'Realizado'">

                <div class="transfer-route">

                  <span class="origin">
                    {{ transfer.originAccountName }}
                  </span>

                  <ion-icon src="assets/icon/arrow-swap.svg"></ion-icon>

                  <span class="destination">
                    {{ transfer.destinationAccountName }}
                  </span>

                </div>

                <div
                  *ngIf="transfer.comment"
                  class="transfer-comment">
                  {{ transfer.comment }}
                </div>

              </ng-container>

            </div>

          </div>

          <!-- RIGHT -->
          <div class="transfer-right">

            <div class="transfer-amount">
              S/. {{ transfer.amount }}
            </div>

            <ion-icon
              class="transfer-arrow"
              src="assets/icon/right-inline.svg">
            </ion-icon>

          </div>

        </button>

      </div>

    </section>

  </div>

  <app-floating-action-button
    ariaLabel="Agregar transferencia"
    (clicked)="navigateToAddTransfer()">
  </app-floating-action-button>

</ion-content>

<!-- ==========================================================
     ALERTS
     ========================================================== -->

<app-custom-alert
  *ngIf="showCustomAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en la transferencia. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showCustomAlert = false"
  (onConfirm)="salirSinGuardar()">
</app-custom-alert>

<app-basic-alert
  *ngIf="showGenericAlert"
  [message]="'No se pudo completar la acción. Por favor, intenta nuevamente.'"
  [imageUrl]="'assets/icon/alert-triangle.svg'"
  [confirmText]="'Entendido'"
  [alertSize]="'medium'"
  [reverseButtons]="true"
  [showCancel]="false"
  (onConfirm)="showGenericAlert = false">
</app-basic-alert>

<!-- ACCOUNT MODAL -->
<app-account-selector-modal
  [isOpen]="isAccountModalOpen"
  [accounts]="accounts"
  [selectionMode]="AccountSelectionMode.MULTIPLE"
  [selectedAccounts]="selectedAccounts"
  (modalClosed)="closeAccountModal()"
  (accountsSelected)="onAccountsSelected($event)">
</app-account-selector-modal>
