<!-- ==========================================================
     HEADER
     ========================================================== -->

<ion-header>

  <app-page-layout
    [title]="title"
    [showBack]="true"
    (back)="backToAccounts()">
  </app-page-layout>

</ion-header>

<!-- ==========================================================
     CONTENT
     ========================================================== -->

<ion-content
  [fullscreen]="true"
  scroll-y="false"
  class="transfer-history-page">

  <div class="content-wrapper">

    <!-- ==========================================================
         FILTERS
         ========================================================== -->

    <section class="filter-section">

      <!-- ==========================================================
           ACCOUNT FILTER
           ========================================================== -->

      <button
        type="button"
        class="account-filter"
        [class.active]="selectedAccounts.length !== accounts.length"
        (click)="openAccountModal()">

        <div class="filter-content">

          <div
            class="filter-icon"
            [class.all]="selectedAccounts.length !== 1"
            [style.background]="selectedAccounts.length === 1 ? selectedAccountColor : null">

            <ion-icon
              *ngIf="selectedAccounts.length !== 1"
              src="assets/icon/wallet.svg">
            </ion-icon>

            <ion-icon
              *ngIf="selectedAccounts.length === 1"
              [src]="'assets/icon/' + selectedAccountIcon + '.svg'">
            </ion-icon>

          </div>

          <div class="filter-text">
            <span>{{ accountFilterLabel }}</span>
          </div>

        </div>

        <ion-icon
          class="filter-arrow"
          src="assets/icon/down.svg">
        </ion-icon>

      </button>

      <!-- ==========================================================
           PERIOD
           ========================================================== -->

      <app-custom-segment
        [options]="periodTabs"
        [(model)]="selectedPeriod"
        segmentClass="period-tabs"
        (modelChange)="onPeriodChange()">
      </app-custom-segment>

      <!-- ==========================================================
           PERIOD NAVIGATION
           ========================================================== -->

      <div class="period-navigation">

        <button
          type="button"
          class="nav-btn"
          (click)="selectedPeriod === 'semana'
            ? changeWeek(-1)
            : selectedPeriod === 'mes'
              ? changeMonth(-1)
              : changeYear(-1)">

          <ion-icon src="assets/icon/left-inline.svg"></ion-icon>

        </button>

        <div class="period-label">

          <span *ngIf="selectedPeriod === 'semana'">
            Semana {{ selectedWeekOfMonth }} · {{ getMonthName(selectedMonth) }} {{ selectedYear }}
          </span>

          <span *ngIf="selectedPeriod === 'mes'">
            {{ getMonthName(selectedMonth) }} {{ selectedYear }}
          </span>

          <span *ngIf="selectedPeriod === 'anio'">
            {{ selectedYear }}
          </span>

        </div>

        <button
          type="button"
          class="nav-btn"
          (click)="selectedPeriod === 'semana'
            ? changeWeek(1)
            : selectedPeriod === 'mes'
              ? changeMonth(1)
              : changeYear(1)">

          <ion-icon src="assets/icon/right-inline.svg"></ion-icon>

        </button>

      </div>

    </section>

    <!-- ==========================================================
         TRANSFERS
         ========================================================== -->

    <section class="transfers-list">

      <div
        *ngIf="groupedTransfers.length === 0"
        class="no-data">

        <ion-icon
          class="empty-icon"
          src="assets/icon/transfer.svg">
        </ion-icon>

        <p>No hay transferencias para mostrar</p>

      </div>

      <div
        *ngFor="let group of groupedTransfers"
        class="transfer-group">

        <div class="date-header">

          <span class="date-text">

            {{ group.fecha }}

          </span>

        </div>

        <button
          *ngFor="let transfer of group.items"
          type="button"
          class="transfer-item"
          (click)="editTransfer(transfer)">

          <div
            class="transfer-icon"
            [class.icon-inicial]="transfer.type === 'Inicial'"
            [class.icon-ajuste]="transfer.type === 'Ajuste'"
            [class.icon-realizado]="transfer.type === 'Realizado'">

            <ion-icon
              [src]="'assets/icon/' + getTransferIcon(transfer.type) + '.svg'">
            </ion-icon>

          </div>

          <div class="transfer-info">

            <ng-container *ngIf="transfer.type === 'Inicial'">

              <div class="transfer-title">
                {{ transfer.destinationAccountName }}
              </div>

              <div class="transfer-comment">
                Monto inicial
              </div>

            </ng-container>

            <ng-container *ngIf="transfer.type === 'Ajuste'">

              <div class="transfer-title">
                {{ transfer.originAccountName }}
              </div>

              <div class="transfer-comment">
                Ajuste del monto
              </div>

            </ng-container>

            <ng-container *ngIf="transfer.type === 'Realizado'">

              <div class="transfer-accounts">

                <span class="origin">
                  {{ transfer.originAccountName }}
                </span>

                <ion-icon src="assets/icon/right-double.svg"></ion-icon>

                <span class="destination">
                  {{ transfer.destinationAccountName }}
                </span>

              </div>

              <div
                *ngIf="transfer.comment"
                class="transfer-comment">

                {{ transfer.comment }}

              </div>

            </ng-container>

          </div>

          <div class="transfer-amount">

            S/. {{ transfer.amount }}

          </div>

        </button>

      </div>

    </section>

  </div>

  <!-- ==========================================================
       FAB
       ========================================================== -->

  <ion-fab
    vertical="bottom"
    horizontal="end"
    slot="fixed"
    class="fab-custom">

    <ion-fab-button
      (click)="navigateToAddTransfer()">

      <ion-icon src="assets/icon/add.svg"></ion-icon>

    </ion-fab-button>

  </ion-fab>

</ion-content>

<!-- ==========================================================
     ALERT
     ========================================================== -->

<app-custom-alert
  *ngIf="showCustomAlert"
  header="Cambios sin guardar"
  message="Has realizado cambios en la transferencia. ¿Deseas salir sin guardar?"
  cancelText="No"
  confirmText="Sí"
  (onCancel)="showCustomAlert = false"
  (onConfirm)="salirSinGuardar()">
</app-custom-alert>

<!-- ==========================================================
     ERROR ALERT
     ========================================================== -->

<app-basic-alert
  *ngIf="showGenericAlert"
  [message]="'No se pudo completar la acción. Por favor, intenta nuevamente.'"
  [imageUrl]="'assets/icon/alert-triangle.svg'"
  [confirmText]="'Entendido'"
  [alertSize]="'medium'"
  [reverseButtons]="true"
  [showCancel]="false"
  (onConfirm)="showGenericAlert = false">
</app-basic-alert>

<!-- ==========================================================
     ACCOUNT SELECTOR
     ========================================================== -->

<app-account-selector-modal
  [isOpen]="isAccountModalOpen"
  [accounts]="accounts"
  [selectionMode]="AccountSelectionMode.MULTIPLE"
  [selectedAccounts]="selectedAccounts"
  (modalClosed)="closeAccountModal()"
  (accountsSelected)="onAccountsSelected($event)">
</app-account-selector-modal>
