<app-base-modal
  [isOpen]="isOpen"
  title="Cambiar contraseña"
  description="Ingresa tu contraseña actual y luego escribe la nueva contraseña dos veces para confirmarla."
  primaryText="Guardar"
  secondaryText="Cancelar"
  [primaryDisabled]="!canSave"
  (primary)="onSave()"
  (secondary)="onCancel()"
  (closed)="onCancel()"
>
  <div class="password-form">
    <div class="input-field-container">
      <div
        class="field-edit-input-wrap"
        [class.field-edit-input-wrap--focused]="currentFocused"
        [class.field-edit-input-wrap--error]="!!currentError"
      >
        <ion-input
          class="field-edit-input"
          label="Contraseña actual"
          labelPlacement="stacked"
          [(ngModel)]="currentPassword"
          (ngModelChange)="onValueChange()"
          (ionFocus)="currentFocused = true"
          (ionBlur)="currentFocused = false"
          placeholder="Ingresa tu contraseña actual"
          [type]="showCurrent ? 'text' : 'password'"
        ></ion-input>
        <button
          type="button"
          class="password-toggle"
          (click)="showCurrent = !showCurrent"
          [attr.aria-label]="
            showCurrent ? 'Ocultar contraseña' : 'Mostrar contraseña'
          "
        >
          <ion-icon
            [name]="showCurrent ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </button>
      </div>
      <div *ngIf="currentError" class="input-error-msg">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ currentError }}</span>
      </div>
    </div>

    <div class="input-field-container">
      <div
        class="field-edit-input-wrap"
        [class.field-edit-input-wrap--focused]="newFocused"
        [class.field-edit-input-wrap--error]="!!newPasswordError"
      >
        <ion-input
          class="field-edit-input"
          label="Nueva contraseña"
          labelPlacement="stacked"
          [(ngModel)]="newPassword"
          (ngModelChange)="onValueChange()"
          (ionFocus)="newFocused = true"
          (ionBlur)="newFocused = false"
          placeholder="Ingrese su nueva contraseña"
          [type]="showNew ? 'text' : 'password'"
        ></ion-input>
        <button
          type="button"
          class="password-toggle"
          (click)="showNew = !showNew"
          [attr.aria-label]="
            showNew ? 'Ocultar contraseña' : 'Mostrar contraseña'
          "
        >
          <ion-icon
            [name]="showNew ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </button>
      </div>
      <div *ngIf="newPasswordError" class="input-error-msg">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ newPasswordError }}</span>
      </div>
      <div *ngIf="newPassword" class="strength-indicator">
        <div class="strength-bar">
          <div
            class="strength-bar-fill"
            [class.strength-bar-fill--weak]="passwordStrength.level === 'weak'"
            [class.strength-bar-fill--medium]="passwordStrength.level === 'medium'"
            [class.strength-bar-fill--strong]="passwordStrength.level === 'strong'"
            [style.width.%]="(passwordStrength.score / 5) * 100"
          ></div>
        </div>
        <span
          class="strength-label"
          [class.strength-label--weak]="passwordStrength.level === 'weak'"
          [class.strength-label--medium]="passwordStrength.level === 'medium'"
          [class.strength-label--strong]="passwordStrength.level === 'strong'"
        >
          {{ passwordStrength.label }}
        </span>
      </div>
    </div>

    <div class="input-field-container">
      <div
        class="field-edit-input-wrap"
        [class.field-edit-input-wrap--focused]="confirmFocused"
        [class.field-edit-input-wrap--error]="!!confirmError"
      >
        <ion-input
          class="field-edit-input"
          label="Repetir nueva contraseña"
          labelPlacement="stacked"
          [(ngModel)]="confirmPassword"
          (ngModelChange)="onValueChange()"
          (ionFocus)="confirmFocused = true"
          (ionBlur)="confirmFocused = false"
          placeholder="Vuelve a escribir la nueva contraseña"
          [type]="showConfirm ? 'text' : 'password'"
        ></ion-input>
        <button
          type="button"
          class="password-toggle"
          (click)="showConfirm = !showConfirm"
          [attr.aria-label]="
            showConfirm ? 'Ocultar contraseña' : 'Mostrar contraseña'
          "
        >
          <ion-icon
            [name]="showConfirm ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </button>
      </div>
      <div *ngIf="confirmError" class="input-error-msg">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ confirmError }}</span>
      </div>
    </div>
  </div>
</app-base-modal>
