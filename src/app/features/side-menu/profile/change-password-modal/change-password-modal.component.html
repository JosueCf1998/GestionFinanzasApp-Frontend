<app-base-modal
  [isOpen]="isOpen"
  title="Cambiar contraseña"
  description="Ingresa tu nueva contraseña. Debe tener al menos 8 caracteres."
  primaryText="Actualizar contraseña"
  secondaryText="Cancelar"
  [primaryDisabled]="form.invalid || loading"
  [secondaryDisabled]="loading"
  size="sm"
  (closed)="onClose()"
  (primary)="onSubmit()"
  (secondary)="onClose()">

  <form [formGroup]="form" class="change-password-form" (ngSubmit)="onSubmit()">

    <!-- NUEVA CONTRASEÑA -->
    <div class="field-group">
      <label class="input-label">Nueva contraseña</label>
      <ion-item lines="none" class="modal-form-item">
        <ion-icon slot="start" src="assets/icon/password.svg" class="field-icon"></ion-icon>
        <ion-input
          [type]="showNewPassword ? 'text' : 'password'"
          placeholder="Mínimo 8 caracteres"
          formControlName="newPassword"
          required>
        </ion-input>
        <ion-button
          fill="clear"
          slot="end"
          class="eye-toggle-btn"
          (click)="toggleShowNewPassword()">
          <ion-icon
            [src]="showNewPassword ? 'assets/icon/eye-outline.svg' : 'assets/icon/eye-off-outline.svg'">
          </ion-icon>
        </ion-button>
      </ion-item>
      <p class="field-hint" *ngIf="form.get('newPassword')?.hasError('minlength') && form.get('newPassword')?.touched">
        La contraseña debe tener al menos 8 caracteres.
      </p>
    </div>

    <!-- CONFIRMAR CONTRASEÑA -->
    <div class="field-group">
      <label class="input-label">Confirmar contraseña</label>
      <ion-item lines="none" class="modal-form-item">
        <ion-icon slot="start" src="assets/icon/password.svg" class="field-icon"></ion-icon>
        <ion-input
          [type]="showConfirmPassword ? 'text' : 'password'"
          placeholder="Repite tu contraseña"
          formControlName="confirmPassword"
          required>
        </ion-input>
        <ion-button
          fill="clear"
          slot="end"
          class="eye-toggle-btn"
          (click)="toggleShowConfirmPassword()">
          <ion-icon
            [src]="showConfirmPassword ? 'assets/icon/eye-outline.svg' : 'assets/icon/eye-off-outline.svg'">
          </ion-icon>
        </ion-button>
      </ion-item>
      <p class="field-hint" *ngIf="form.get('confirmPassword')?.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">
        Las contraseñas no coinciden.
      </p>
    </div>

  </form>

</app-base-modal>
