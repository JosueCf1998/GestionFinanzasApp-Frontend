<ion-content [fullscreen]="true" scroll-y="false">
  <div class="welcome-screen">
    <!-- Animated Background -->
    <div class="animated-background">
      <div class="gradient-orb orb-1"></div>
      <div class="gradient-orb orb-2"></div>
    </div>

    <!-- Content Container -->
    <div class="content-wrapper">
      <!-- Logo Section -->
      <div class="logo-section">
        <div class="logo-wrapper">
          <ion-img src="assets/image/logo-finvia-white.png" class="logo"></ion-img>
        </div>
      </div>

      <!-- Text Content -->
      <div class="text-content">
        <h1 class="welcome-title">¡Bienvenido a Finvia!</h1>
        <p class="welcome-subtitle">Tu aliado en la gestión financiera</p>
        <p class="welcome-description">
          Controla tus ingresos y gastos de manera inteligente y sencilla
        </p>
      </div>

      <!-- CTA Button -->
      <div class="action-section">
        <ion-button
          expand="block"
          shape="round"
          class="cta-button"
          (click)="toNavigate()">
          Comenzar
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
