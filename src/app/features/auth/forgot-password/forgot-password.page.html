<ion-content class="auth-content" scroll-y="false">
  <div class="background-curve"></div>

  <div class="forgot-container">
    <div class="header-section">
      <div class="back-icon" (click)="goBack()">
        <ion-icon class="icon" src="assets/icon/left.svg"></ion-icon>
      </div>
      <div class="icon-wrapper">
        <ion-icon src="assets/icon/user-question.svg" class="main-icon"></ion-icon>
      </div>
      <h1>Recupera tu Contraseña</h1>
      <p>Ingresa los siguientes datos</p>
    </div>

    <form class="forgot-form" [formGroup]="forgotForm">
      <ion-item lines="none" class="form-item">
        <ion-icon slot="start" src="assets/icon/mail.svg"></ion-icon>
        <ion-input
          type="email"
          placeholder="Correo electrónico"
          formControlName="email"
          required
        ></ion-input>
      </ion-item>

      <ion-item lines="none" class="form-item">
        <ion-icon slot="start" src="assets/icon/password.svg"></ion-icon>
        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Nueva Contraseña"
          formControlName="password"
          required
        ></ion-input>
        <ion-button fill="clear" slot="end" (click)="togglePassword()">
          <ion-icon
            [src]="showPassword ? 'assets/icon/eye-outline.svg' : 'assets/icon/eye-off-outline.svg'"
          ></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item lines="none" class="form-item">
        <ion-icon slot="start" src="assets/icon/password.svg"></ion-icon>
        <ion-input
          [type]="showRepeatPassword ? 'text' : 'password'"
          placeholder="Repite la Contraseña"
          formControlName="repeatPassword"
          required
        ></ion-input>
        <ion-button fill="clear" slot="end" (click)="toggleRepeatPassword()">
          <ion-icon
            [src]="showRepeatPassword ? 'assets/icon/eye-outline.svg' : 'assets/icon/eye-off-outline.svg'"
          ></ion-icon>
        </ion-button>
      </ion-item>
    </form>

    <ion-button
      expand="block"
      shape="round"
      class="forgot-btn"
      (click)="handleForgotPassword()"
    >
      Restablecer Contraseña
    </ion-button>

  </div>

  <!-- Alerts -->
  <app-basic-alert
    *ngIf="showGenericAlert"
    [message]="'No se pudo completar la acción. Por favor, intenta nuevamente.'"
    [imageUrl]="'assets/icon/alert-triangle.svg'"
    [confirmText]="'Entendido'"
    [alertSize]="'medium'"
    [reverseButtons]="true"
    [showCancel]="false"
    (onConfirm)="closeAlerts()"
  >
  </app-basic-alert>

  <app-basic-alert
    *ngIf="showUnauthorizedAlert"
    [message]="messageError"
    [imageUrl]="'assets/icon/alert-triangle.svg'"
    [confirmText]="'Entendido'"
    [alertSize]="'medium'"
    [reverseButtons]="true"
    [showCancel]="false"
    (onConfirm)="closeAlerts()"
  >
  </app-basic-alert>
</ion-content>
