<ion-content [fullscreen]="true" class="auth-content">
  <div class="background-curve"></div>

  <div class="login-container">
    <!-- Logo/Header -->
    <div class="header">
      <ion-img src="assets/image/logo.png" class="logo"></ion-img>
      <h1>Bienvenido</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <!-- Formulario -->
    <form class="login-form" [formGroup]="loginForm">
      <ion-item lines="none" class="form-item">
        <ion-icon slot="start" src="assets/icon/mail.svg" color="medium"></ion-icon>
        <ion-input
          type="email"
          placeholder="Correo electrónico"
          formControlName="email"
          required>
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="form-item">
        <ion-icon slot="start" src="assets/icon/password.svg" color="medium"></ion-icon>
        <ion-input
          type="password"
          placeholder="Contraseña"
          formControlName="password"
          required>
        </ion-input>
        <ion-button fill="clear" slot="end" (click)="togglePassword()">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-item>


      <div class="section">
        <div class="label-links">
          <ion-button expand="block" fill="clear" size="small" class="ion-text-center label-links" (click)="forgotPassword()">
            ¿Olvidaste tu contraseña?
          </ion-button>
        </div>


        <ion-button
          expand="block"
          shape="round"
          class="login-btn"
          (click)="login()">
          Iniciar sesión
        </ion-button>


        <ion-text class="ion-text-center label-links">
          <p>ó</p>
        </ion-text>

        <ion-button
          expand="block"
          shape="round"
          class="login-btn"
          (click)="goToRegister()">
          Crear una cuenta
        </ion-button>
      </div>

    </form>
  </div>
</ion-content>
