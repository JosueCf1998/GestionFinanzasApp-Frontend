<ion-content [fullscreen]="true" class="auth-content" scroll-y="false">
  <div class="background-curve"></div>

  <div class="login-container">
    <!-- Logo/Header -->
    <div class="header">
      <ion-img src="assets/image/logo.png" class="logo"></ion-img>
      <h1 class="text-title">Bienvenido</h1>
      <p class="text-body text-secondary">Inicia sesión para continuar</p>
    </div>

    <!-- Formulario -->
    <form class="login-form" [formGroup]="loginForm">
      <ion-item lines="none" class="form-item">
        <ion-icon
          slot="start"
          src="assets/icon/mail.svg"
          color="medium"
        ></ion-icon>
        <ion-input
          type="email"
          placeholder="Correo electrónico"
          formControlName="email"
          required
        >
        </ion-input>
      </ion-item>

      <ion-item lines="none" class="form-item">
        <ion-icon
          slot="start"
          src="assets/icon/password.svg"
          color="medium"
        ></ion-icon>
        <ion-input
          type="password"
          placeholder="Contraseña"
          formControlName="password"
          required
        >
        </ion-input>
        <ion-button fill="clear" slot="end" (click)="togglePassword()">
          <ion-icon
            [src]="showPassword ? 'assets/icon/eye-outline.svg' : 'assets/icon/eye-off-outline.svg'"
          ></ion-icon>
        </ion-button>
      </ion-item>

      <div class="section">
        <div class="label-links">
          <ion-button
            expand="block"
            fill="clear"
            size="small"
            class="ion-text-center label-links text-link"
            (click)="forgotPassword()"
          >
            ¿Olvidaste tu contraseña?
          </ion-button>
        </div>

        <ion-button
          expand="block"
          shape="round"
          class="login-btn text-button"
          (click)="login()"
        >
          Iniciar sesión
        </ion-button>

        <ion-text class="ion-text-center label-links">
          <p class="text-caption text-secondary">ó</p>
        </ion-text>

        <ion-button
          expand="block"
          shape="round"
          class="login-btn text-button"
          (click)="goToRegister()"
        >
          Crear una cuenta
        </ion-button>
      </div>
    </form>
  </div>

  <app-basic-alert
    *ngIf="showGenericAlert"
    [message]="'No se pudo completar la acción. Por favor, intenta nuevamente.'"
    [imageUrl]="'assets/icon/alert-triangle.svg'"
    [confirmText]="'Entendido'"
    [alertSize]="'medium'"
    [reverseButtons]="true"
    [showCancel]="false"
    (onConfirm)="showGenericAlert = false"
  >
  </app-basic-alert>

  <app-basic-alert
    *ngIf="showUnauthorizedAlert"
    [message]="messageError"
    [imageUrl]="'assets/icon/alert-triangle.svg'"
    [confirmText]="'Entendido'"
    [alertSize]="'medium'"
    [reverseButtons]="true"
    [showCancel]="false"
    (onConfirm)="showUnauthorizedAlert = false"
  >
  </app-basic-alert>
  
</ion-content>
