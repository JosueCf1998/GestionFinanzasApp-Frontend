<ion-content
  [fullscreen]="true"
  class="auth-content"
  scroll-y="false">

  <div class="background-curve"></div>

  <!-- BACK BUTTON -->

  <div
    class="back-icon"
    (click)="goBack()">

    <ion-icon
      class="icon"
      src="assets/icon/left.svg">
    </ion-icon>

  </div>

  <!-- CONTAINER -->

  <div class="register-container">

    <!-- HEADER -->

    <div class="header-section">

      <div class="icon-wrapper">

        <ion-icon
          src="assets/icon/user-plus.svg"
          class="main-icon">
        </ion-icon>

      </div>

      <h1 class="text-title register-title">
        Crea tu Cuenta
      </h1>

      <p class="text-body register-subtitle">
        Completa los siguientes datos
      </p>

    </div>

    <!-- FORM -->

    <form
      class="register-form"
      [formGroup]="registerForm">

      <!-- NOMBRE -->

      <ion-item
        lines="none"
        class="form-item">

        <ion-icon
          slot="start"
          src="assets/icon/user.svg">
        </ion-icon>

        <ion-input
          type="text"
          placeholder="Nombres"
          formControlName="name"
          required>
        </ion-input>

      </ion-item>

      <!-- APELLIDO -->

      <ion-item
        lines="none"
        class="form-item">

        <ion-icon
          slot="start"
          src="assets/icon/user.svg">
        </ion-icon>

        <ion-input
          type="text"
          placeholder="Apellidos"
          formControlName="lastName"
          required>
        </ion-input>

      </ion-item>

      <!-- EMAIL -->

      <ion-item
        lines="none"
        class="form-item">

        <ion-icon
          slot="start"
          src="assets/icon/mail.svg">
        </ion-icon>

        <ion-input
          type="email"
          placeholder="Correo electrónico"
          formControlName="email"
          required>
        </ion-input>

      </ion-item>

      <!-- PASSWORD -->

      <ion-item
        lines="none"
        class="form-item">

        <ion-icon
          slot="start"
          src="assets/icon/password.svg">
        </ion-icon>

        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Contraseña"
          formControlName="password"
          required>
        </ion-input>

        <ion-button
          fill="clear"
          slot="end"
          class="eye-toggle-btn"
          (click)="togglePassword()">

          <ion-icon
            [src]="showPassword
              ? 'assets/icon/eye-outline.svg'
              : 'assets/icon/eye-off-outline.svg'">
          </ion-icon>

        </ion-button>

      </ion-item>

      <!-- REPEAT PASSWORD -->

      <ion-item
        lines="none"
        class="form-item">

        <ion-icon
          slot="start"
          src="assets/icon/password.svg">
        </ion-icon>

        <ion-input
          [type]="showRepeatPassword ? 'text' : 'password'"
          placeholder="Repite la Contraseña"
          formControlName="repeatPassword"
          required>
        </ion-input>

        <ion-button
          fill="clear"
          slot="end"
          class="eye-toggle-btn"
          (click)="toggleRepeatPassword()">

          <ion-icon
            [src]="showRepeatPassword
              ? 'assets/icon/eye-outline.svg'
              : 'assets/icon/eye-off-outline.svg'">
          </ion-icon>

        </ion-button>

      </ion-item>

      <!-- SUBMIT -->

      <ion-button
        expand="block"
        shape="round"
        class="register-btn text-button"
        (click)="handleRegister()">

        Crear Cuenta

      </ion-button>

    </form>

  </div>

  <!-- SUCCESS ALERT -->

  <app-custom-alert
    *ngIf="showSuccessAlert"
    header="Éxito"
    [message]="'Usuario registrado con éxito.'"
    [imageUrl]="'assets/icon/check.svg'"
    [confirmText]="'Ir a Login'"
    [alertSize]="'medium'"
    [reverseButtons]="true"
    [showCancel]="false"
    (onConfirm)="handleSuccessConfirm()">
  </app-custom-alert>

  <!-- GENERIC ERROR -->

  <app-custom-alert
    *ngIf="showGenericAlert"
    header="Error"
    [message]="'No se pudo completar la acción. Por favor, intenta nuevamente.'"
    [imageUrl]="'assets/icon/alert-triangle.svg'"
    [confirmText]="'Entendido'"
    [alertSize]="'medium'"
    [reverseButtons]="true"
    [showCancel]="false"
    (onConfirm)="closeAlerts()">
  </app-custom-alert>

  <!-- UNAUTHORIZED ERROR -->

  <app-custom-alert
    *ngIf="showUnauthorizedAlert"
    header="Error"
    [message]="messageError"
    [imageUrl]="'assets/icon/alert-triangle.svg'"
    [confirmText]="'Entendido'"
    [alertSize]="'medium'"
    [reverseButtons]="true"
    [showCancel]="false"
    (onConfirm)="closeAlerts()">
  </app-custom-alert>

</ion-content>
