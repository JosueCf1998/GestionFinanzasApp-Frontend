<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="transactions" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4361EE"/>
      <stop offset=".55" stop-color="#5B4BE3"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="transactionsShadow" x="4" y="5" width="56" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dy="3" stdDeviation="3" flood-color="#3A0CA3" flood-opacity=".14"/>
    </filter>
  </defs>
  <g filter="url(#transactionsShadow)">
    <!-- Base de tarjeta secundaria en ángulo -->
    <rect x="13" y="10" width="40" height="34" rx="9" fill="#4361EE" opacity=".28" transform="rotate(-5 13 10)"/>

    <!-- Tarjeta principal con gradiente Finvia -->
    <rect x="10" y="13" width="44" height="40" rx="10" fill="url(#transactions)" opacity=".95"/>

    <!-- Flujo de Transacción Superior (Egreso / Salida) -->
    <g transform="translate(0, 0)">
      <circle cx="20" cy="25" r="4.5" fill="#EEF2FF" opacity=".2"/>
      <path d="M17 25h16m-4-3.5 3.5 3.5-3.5 3.5" stroke="#EEF2FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="43" cy="25" r="2" fill="#EEF2FF" opacity=".85"/>
      <path d="M37 25h3" stroke="#EEF2FF" stroke-width="2" stroke-linecap="round" opacity=".5"/>
    </g>

    <!-- Divisor sutil -->
    <path d="M16 33h32" stroke="#EEF2FF" stroke-opacity=".22" stroke-width="1.2" stroke-dasharray="2.5 2.5"/>

    <!-- Flujo de Transacción Inferior (Ingreso / Entrada) -->
    <g transform="translate(0, 0)">
      <circle cx="44" cy="41" r="4.5" fill="#4CC9F0" opacity=".25"/>
      <path d="M47 41H31m4-3.5-3.5 3.5 3.5 3.5" stroke="#4CC9F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="21" cy="41" r="2" fill="#4CC9F0" opacity=".95"/>
      <path d="M24 41h3" stroke="#4CC9F0" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    </g>
  </g>
</svg>

